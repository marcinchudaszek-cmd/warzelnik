ych lagerów."},{id:"palony-jeczmien",name:"Jęczmień palony (roasted barley)",type:"palony",ebc:1300,extract:65,maxPercent:5,description:"Niesłodowany palony jęczmień. Wyrazista kawowa goryczka i sucha, palona końcówka. Znak rozpoznawczy irlandzkich stoutów."},{id:"barwiacy",name:"Słód barwiący (Sinamar/black)",type:"palony",ebc:1400,extract:65,maxPercent:3,description:"Najciemniejszy słód. Używany oszczędnie do pogłębienia barwy. Duże ilości dają ostrą, palą goryczkę."},{id:"melanoidynowy",name:"Słód melanoidynowy",type:"specjalny",ebc:70,extract:76,maxPercent:15,description:"Imituje efekt dekokcji: intensywnie słodowy, chlebowy charakter. Do bocków, dunkli, piw czerwonych."},{id:"wedzony",name:"Słód wędzony (rauchmalz)",type:"specjalny",ebc:6,extract:80,maxPercent:100,description:"Wędzony dymem bukowym. Od subtelnej wędzonki (10%) po pełny rauchbier (100%). Klasyka z Bambergu."},{id:"kwaskowy",name:"Słód kwaskowy (sauermalz)",type:"specjalny",ebc:5,extract:75,maxPercent:10,description:"Zakwaszony naturalnie kwasem mlekowym. Obniża pH zacieru (1% ≈ -0,1 pH). Do jasnych lagerów i berliner weisse."},{id:"platki-owsiane",name:"Płatki owsiane",type:"specjalny",ebc:3,extract:70,maxPercent:20,description:"Nadają jedwabistą, kremową pełnię i mętność. Nieodzowne w oatmeal stoutach i NEIPA. Wymagają zacierania ze słodem bazowym."},{id:"platki-pszenne",name:"Płatki pszenne",type:"specjalny",ebc:3,extract:72,maxPercent:40,description:"Poprawiają pianę i mętność. Klasyka w witbierach i NEIPA. Wymagają zacierania ze słodem bazowym."},{id:"cukier-bialy",name:"Cukier biały",type:"dodatek",ebc:0,extract:100,maxPercent:20,description:"W 100% fermentowalny – wysusza piwo i podnosi ABV bez pełni. Do belgijskich mocnych ale i wzmacniania IPA."},{id:"cukier-kandyzowany-ciemny",name:"Cukier kandyzowany ciemny",type:"dodatek",ebc:500,extract:80,maxPercent:20,description:"Belgijski syrop kandyzowany. Nuty rodzynek, śliwek i karmelu. Podstawa dubbli i quadrupli."},{id:"miod",name:"Miód",typ is unachievable any other way."},{"n":10,"name":"Bramling X","tagline":"Single Hop IPA Series - 2011.","first":"01/2011","desc":"Good old Bramling Cross is elegant, refined, assured, (boring) and understated. Understated that is unless you hop the living daylights out of a beer with it. This is Bramling Cross re-invented and re-imagined, and shows just what can be done with English hops if you use enough of them. Poor Bramling Cross normally gets lost in a woeful stream of conformist brown ales made by sleepy cask ale brewers. But not anymore. This beer shows that British hops do have some soul, and is a fruity riot of blackberries, pears, and plums. Reminds me of the bramble, apple and ginger jam my grandmother used to make.","abv":7.5,"ibu":75,"og":1068,"fg":1013,"ebc":22,"ph":4.4,"att":80.9,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Extra Pale",6.38],["Crystal 150",0.13],["Caramalt",0.25]],"hops":[["Bramling Cross",60,"grams","start","bitter"],["Bramling Cross",50,"grams","end","flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Warm blackberry pie","Vinegar doused fish and chips","Aromatic korma curry with lemon and garlic naan"],"tips":"Getting good Bramling Cross is key. Most English hops are in leaf form (not pelletised), so getting fresh hops close to harvest (September) will give this beer the right amount of dark berry intensity."},{"n":11,"name":"Misspent Youth","tagline":"Milk & Honey Scotch Ale.","first":"04/2013","desc":"The brainchild of our small batch brewer, George Woods. A dangerously drinkable milk sugar- infused Scotch Ale.","abv":7.3,"ibu":30,"og":1079,"fg":1020,"ebc":120,"ph":4.4,"att":74.7,"batchL":20,"boilL":25,"mash":[[67,75]],"ferm":19,"twist":"See honey and lactose additions","malts":[["Pale Ale",2.18],["Caramalt",0.3],["Dark Crystal",0.3],["Smoked Weyermann",1.8],["Flaked Oats",0.6],["Brown",0.6],["Amber",0.1],["Chocolate",0.05],["Munich",0.6],["Crystal 150",0.2]],"hops":[["First Gold",25,"grams","st aracter to the mix. The Belgian Tripel comes loaded with complex spicy, fruity esters, and punchy citrus hop character.","abv":14.5,"ibu":50,"og":1093,"fg":1014,"ebc":40,"ph":4.4,"att":85,"batchL":20,"boilL":25,"mash":[[65,40]],"ferm":21,"twist":"Barrel aged and blended with Anarchist Alchemist","malts":[["Pale Ale - Tipple",11.1],["Caramalt",0.94],["Crystal",0.44]],"hops":[["Columbus Extract",12.5,"grams","start","bitter"],["Centennial",37.5,"grams","end","flavour"],["Cascade",37.5,"grams","end","flavour"],["Simcoe",37.5,"grams","end","flavour"]],"yeast":"Wyeast 3522 - Belgian Ardennes™","food":["Coriander & chilli crab cakes","Goats cheese salad with walnuts, radish and blood orange","Pistachio cake"],"tips":"Brew twice as much Belgian Tripel as you were planning on ageing - it's awesome on its own too!"},{"n":16,"name":"Libertine Porter","tagline":"Dry-Hopped Aggressive Porter.","first":"01/2012","desc":"An avalanche of cross-continental hop varieties give this porter a complex spicy, resinous and citrusy aroma, with a huge malt bill providing a complex roasty counterpoint. Digging deeper into the flavour draws out cinder toffee, bitter chocolate and hints of woodsmoke.","abv":6.1,"ibu":45,"og":1067,"fg":1020,"ebc":219,"ph":4.4,"att":70.1,"batchL":20,"boilL":25,"mash":[[68,35]],"ferm":18,"twist":null,"malts":[["Extra Pale - Spring Blend",5],["Caramalt",1.25],["Crystal 150",0.63],["Chocolate",0.63],["Roasted Barley",0.63],["Wheat",0.31],["Flaked Oats",0.31],["Smoked Malt",0.06]],"hops":[["Columbus",31.25,"grams","start","bitter"],["Columbus",25,"grams","end","bitter"],["Willamette",25,"grams","end","flavour"],["Galena",25,"grams","end","flavour"],["Columbus",75,"grams","dry hop","aroma"],["Galena",75,"grams","dry hop","aroma"],["Simcoe",100,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Blue cheese beef burger","Glazed short ribs","Chocolate cake"],"tips":"Mash in at a higher temperature to leave more unfermentable sugars in the wort. T r"],["Cascade",18.8,"grams","end","flavour"],["Centennial",18.8,"grams","end","flavour"],["Amarillo",25,"grams","end","flavour"],["Simcoe",31.3,"grams","end","flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Haggis bon bons","Rosemary and lemon roast chicken","Oatmeal and cranberry cookies"],"tips":"Make sure your hops are well broken up and mixed in when added to the kettle for aroma additions. The wort is not boiling so is not agitating the hops to allow mixing. If the hops aren't steeped properly in the wort you won't get the maximum flavour impact."},{"n":27,"name":"Dog B","tagline":"Cacao, Coffee Chili Anniversary Stout.","first":"05/2013","desc":"Our anniversary stout was based on AB:04, one of our most sought after beers ever. This beer is slightly different each year, with subtle variations coming into play purely down to environmental and fermentation factors. What doesn't change is the rich dark chocolate, bitter coffee and chilli warmth of this monumental Stout.","abv":15,"ibu":90,"og":1120,"fg":1003,"ebc":100,"ph":4.4,"att":98,"batchL":20,"boilL":25,"mash":[[65,90]],"ferm":19,"twist":"Based on AB:04, but with added vanilla and 3.5 times the chilli.","malts":[["Extra Pale",8],["Wheat",0.5],["Flaked Oats",1.38],["Dark Crystal",0.88],["Carafa Special Malt Type 1",0.63],["Carafa Special Malt Type 3",0.63],["Honey",0.7]],"hops":[["Chinook",50,"grams","start","bitter"],["Cascade",25,"grams","start","bitter"],["Fuggles",25,"grams","15","bitter"],["Coffee",12.5,"grams","15","twist"],["Fuggles",25,"grams","0"," aroma"],["Coffee",12.5,"grams","0","twist"]],"yeast":"Wyeast 1056 - American Ale™","food":["Blackened cajun beef","Blue cheese","Flourless chocolate cheesecake"],"tips":"Be really careful when mashing, as this amount of malts can get tough to sparge! Add honey into the boil, and naga chili and vanilla in maturation (soak them in some neutral spirit to sanitise)."},{"n":28,"name":"HBC 369","tagline":"Single Hop India Pale Ale – 2012.","first":"02/2012","desc":"HBC 369 brings rich fruity flavours with the tiniest layer of candy coating on top. HBC 369 (the hop) can bring notes of blueberries, pear, and possibly even sweet potato. HBC 369 (the beer) was balanced, with just one hop providing a complex aroma, and a dry bitterness.","abv":6.7,"ibu":67,"og":1013,"fg":1064,"ebc":19,"ph":4.4,"att":79.7,"batchL":20,"boilL":25,"mash":[[68,null]],"ferm":19,"twist":null,"malts":[["Extra Pale - Spring Blend",5.87],["Caramalt",0.37],["Crystal 150",0.19]],"hops":[["HBC 369",40,"grams","start","bitter"],["HBC 369",100,"grams","end","flavour"],["HBC 369",250,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Spicy jalapeño & seared steak fajitas","Grilled spicy corn with feta crumbles","Blueberry pie"],"tips":"HBC 369 is now known as Mosaic!"},{"n":29,"name":"10 Heads High","tagline":"Imperial Red Ale.","first":"04/2013","desc":"10 Heads High is loosely based on our awesome 2011 Prototype beer Hops Kill Nazis. This is an uncompromising 7.8% Imperial Red Ale loaded high with American Hops. Think of this as an Imperial India Red Ale, or a super-charged version of 5am Saint. Either way this is a seriously good beer!","abv":7.8,"ibu":70,"og":1074,"fg":1015,"ebc":90,"ph":4.4,"att":79.7,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":18,"twist":null,"malts":[["Extra Pale",4.75],["Caramalt",1.25],["Crystal 150",0.5],["Dark Crystal",0.13]],"hops":[["Chinook",20,"grams","start","bitter"],["Chinook",5,"grams","middle","bitter"],["Centennial",5,"grams","middle","bitter"],["Chinook",62.5,"grams","end","flavour"],["Centennial",62.5,"grams","end","flavour"],["Chinook",100,"grams","dry hop","aroma"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Arrabiata pasta","Mulled cheddar","Toasted almond cake"],"tips":"Achieve the red colour by using the ratio of Caramalt, Crystal and Dark Crystal malts. The trick is to get the colour, without too much dried fruit character."},{"n":30,"name":"Dana - IPA Is Dead","tagline":"Single Hop India Pale Ale.","first":"02/2013","desc":"Hailing from Slovenia, Dana was originally cross bred from the German Hallertau Magnum and native Slovenian varieties. Like any good faux noble hop should, it infuses a rustic, musty spiciness into a toasty beast of a malt base.","abv":6.7,"ibu":70,"og":1066,"fg":1015,"ebc":30,"ph":4.4,"att":77.3,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Extra Pale",5],["Caramalt",0.31],["Dark Crystal",0.06],["Munich",0.31]],"hops":[["Dana",2.5,"grams","start","bitter"],["Dana",25,"grams","middle","flavour"],["Dana",37.5,"grams","end","flavour"],["Dana",125,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Spicy Asian-style noodles","Smokey chipotle beef brisket tostada","Sweet potato pie"],"tips":"Noble hops (and their offspring) have a fundamentally different profile to many other hops, down to their different oil fractions. Chill your hops to retain all of the spicy, delicate volatile hop oils!"},{"n":31,"name":"Nanny State","tagline":"Alcohol Free Hoppy Ale.","first":"08/2009","desc":"Brewing a full flavoured craft beer at 0.5% is no easy task. Packed with loads of Centennial, Amarillo, Columbus, Cascade and Simcoe hops, dry hopped to the brink and back and sitting at 55 IBUs, Nanny State is a force to be reckoned with. With a backbone of 8 different specialty malts, Nanny State will tantalise your taste buds and leave you yearning for more.","abv":0.5,"ibu":55,"og":1007,"fg":1005,"ebc":30,"ph":4.4,"att":28.6,"batchL":20,"boilL":25,"mash":[[65,30]],"ferm":19,"twist":null,"malts":[["Munich",0.13],["Caramalt",0.19],["Crystal 150",0.06],["Amber",0.03],["Dark Crystal",0.13],["Chocolate",0.06],["Wheat",0.06],["Rye",0.13]],"hops":[["Amarillo",6.3,"grams","start","bitter"],["Simcoe",5,"grams","start","bitter"],["Centennial",6.3,"grams","start","bitter"],["Amarillo",6.3,"grams","middle","flavour"],["Simcoe",2.5,"grams","middle","flavour"],["Centennial",6.3,"grams","middle","flavour"],["Amarillo",5,"grams","end","flavour"],["Simcoe",5,"grams","end","flavour"],["Cascade",12.5,"grams","end","flavour"],["Ahtanum",12.5,"grams","end","flavour"],["Centennial",50,"grams","dry hop","aroma"],["Cascade",50,"grams","dry hop","aroma"],["Ahtanum",25,"grams","dry hop","aroma"],["Simcoe",25,"grams","dry hop","aroma"],["Columbus",37.5,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Earthy mushroom pasta"],"tips":"Get hops in every stage of the brewing process - mash, run off boil and flame off. There's not too much malt body, so the more hops the better."},{"n":32,"name":"AB:05","tagline":"Belgian Imperial Stout.","first":"12/2010","desc":"Belgian Imperial Stout aged on toasted coconut and cacao. The Belgian yeast strain introduces a whole new dimension to the Imperial Stout style resulting in a beer that resembles a marshmallow toasted on a smouldering barbeque then smothered in dark chocolate. Massively seductive and encapsulating this blacker than midnight beer pours with coffee brown head so thick you could almost stand on it, and with an epic lacing on your glass.","abv":12.5,"ibu":40,"og":1126,"fg":1030,"ebc":180,"ph":4.4,"att":76,"batchL":20,"boilL":25,"mash":[[65,90]],"ferm":19,"twist":"Toasted coconut flakes: 75g, Cacao Nibs: 25g","malts":[["Extra Pale",10],["Carafa Special Malt Type 1",0.94],["Carafa Special Malt Type 3",0.94],["Flaked Oats",1.88],["Pale Crystal",1.25],["Dark Crystal",0.63]],"hops":[["First Gold",50,"grams","start","bitter"],["First Gold",50,"grams","end","flavour"]],"yeast":"Wyeast 3522 - Belgian Ardennes™","food":["Venison with cacao nibs","Apple upside-down cake","Toffee marshmallow pie"],"tips":"Add the coconut and cacao nibs after primary fermentation and let infuse for at least 6 months at a low temperature."},{"n":33,"name":"Sorachi Ace","tagline":"Single Hop IPA Series - 2011.","first":"01/2011","desc":"A hop that tastes of bubble gum? Seriously? No, we did not believe it either. But it does! This is one unique, son of a bitch of a hop. Lemony, deep, musty with a smoothness that belies its power. This hop is lemony like a lemon who was angry earlier but is now tired because of all the rage. This hop of Japanese origin is best enjoyed trying to make sushi from your gold fish, or trying to persuade your girlfriend (or boyfriend maybe) to dress up as a Geisha for Valentine’s Day.","abv":7.5,"ibu":75,"og":1068,"fg":1013,"ebc":30,"ph":4.4,"att":82.1,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":19,"twist":null,"malts":[["Extra Pale",6.38],["Crystal 150",0.13],["Caramalt",0.25]],"hops":[["Sorachi Ace",14.5,"grams","start","bitter"],["Sorachi Ace",20,"grams","end","flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Sashimi","Grilled salmon with a herb and citrus infused butter","Basil, lemon and pine nut angel hair pasta with grilled chicken"],"tips":"Sorachi Ace is hop best handled with care. Too much and your beer may taste like dill pickle and lemons."},{"n":34,"name":"Bourbon Baby","tagline":"Barrel-Aged Scotch Ale.","first":"01/2014","desc":"Santa Paws Scotch ale aged in bourbon barrels - light, dry and toasty, with vanilla, hints of chocolate and ginger biscuit, and a faint spicy hoppiness.","abv":5.8,"ibu":35,"og":1049,"fg":1005,"ebc":44,"ph":4.4,"att":90,"batchL":20,"boilL":25,"mash":[[65,90]],"ferm":19,"twist":null,"malts":[["Extra Pale",1.75],["Munich",0.44],["Dark Crystal",0.5],["Wheat",0.56],["Flaked Oats",0.56],["Carafa Special Malt Type 3",0.13],["Amber",0.25],["Weyermann Beech Smoked",0.06]],"hops":[["First Gold",18.5,"grams","start","bitter"],["Willamette",12.5,"grams","middle","flavour"],["Hallertauer Mittelfrüh",6,"grams","middle","flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Blackened cajun beef","Pulled pork","Millionaire's shortbread"],"tips":"Use bourbon-soaked oak chips in secondary to achieve barrel character."},{"n":35,"name":"Berliner Weisse With Raspberries And Rhubarb - B-Sides","tagline":"Fruity Berliner Weiss "first":"12/2009","desc":"Pounding a triple payload of the biggest North American hops humanity has devised, braced by a backbone of caramel malt, this beer is deep, astringent and resinous, pushing to the extremes of lupulin thresholds. There’s nothing inscrutable going on; no mystery in the backstory. It doesn’t seek to be understood. A beer incapable of empathy; only hop overload.","abv":9.2,"ibu":125,"og":1085,"fg":1016,"ebc":40,"ph":4.4,"att":81.2,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":21,"twist":null,"malts":[["Extra Pale",7.4],["Caramalt",0.38],["Crystal 150",0.29]],"hops":[["Columbus Extract",30.8,"grams","start","bitter"],["Columbus",19.2,"grams","start","bitter"],["Columbus",19.2,"grams","middle","flavour"],["Centennial",19.2,"grams","middle","flavour"],["Simcoe",19.2,"grams","middle","flavour"],["Columbus",19.2,"grams","end","flavour"],["Centennial",19.2,"grams","end","flavour"],["Simcoe",19.2,"grams","end","flavour"],["Centennial",115.4,"grams","dry hop","aroma"],["Columbus",96.2,"grams","dry hop","aroma"],["Simcoe",96.2,"grams","dry hop","aroma"],["Amarillo",76.9,"grams","dry hop","aroma"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Spicy wings with blue cheese dip","Pan seared scallops with a chilli sauce","Creamy chocolate and caramel cheesecake"],"tips":"There are so much hops in this beer it may break your gear! Watch out for the end of casting (or knockout for our American brethern), you don’t want to pull too much trub into the fermenter."},{"n":43,"name":"American Wheat","tagline":"Hoppy American Wheat.","first":"07/2014","desc":"A luscious blend of peach, blood orange and banana to make a suitably refreshing beverage that happily straddles the Atlantic.","abv":4.5,"ibu":17,"og":1047,"fg":1013,"ebc":10,"ph":5.3,"att":72,"batchL":20,"boilL":25,"mash":[[64,90]],"ferm":21,"twist":null,"malts":[["Extra Pale",2.13],["Wheat",2.5],["Pale Crystal",0.13]],"hops":[["Ahtanum",25,"grams","start","bitter"],["Ahtanum",25,"grams","end","flavour"]],"yeast":"Wyeast 1010 - American Wheat™","food":["Strawberry and citrus salad","Fish corn tacos with pomegranate salsa","Summer berry fruit parfait"],"tips":"Using a starter to get your yeast as vibrant and healthy as possible will make all the difference here."},{"n":44,"name":"Dog Wired (w/8 Wired)","tagline":"New Zealand Imperial Pilsner.","first":"06/2013","desc":"Brewed in collaboration with Soren from New Zealand’s stellar 8-Wired brewery, this is an Imperial Pilsner featuring two of our favourite New Zealand hops: Nelson Sauvin and Motueka. Sitting at a dangerously drinkable 7.1% ABV there’s a touch of Munich malt which gives this beer that little extra caramel biscuit bite to compliment the lip smackingly tropical hops. Expect an all out NZ hoppy riot.","abv":7.1,"ibu":65,"og":1065,"fg":1010,"ebc":13,"ph":4.4,"att":85,"batchL":20,"boilL":25,"mash":[[64,90]],"ferm":9,"twist":null,"malts":[["Extra Pale",4.7],["Munich",0.38],["Acidulated Malt",0.63]],"hops":[["Nelson Sauvin",20,"grams","start","bitter"],["Motueka",20,"grams","start","bitter"],["Nelson Sauvin",10,"grams","middle","flavour"],["Motueka",10,"grams","middle","flavour"],["Nelson Sauvin",20,"grams","end","flavour"],["Motueka",20,"grams","end","flavour"],["Motueka",100,"grams","dry hop","aroma"],["Nelson Sauvin",87.5,"grams","dry hop","aroma"]],"yeast":"Wyeast 2007 - Pilsen Lager™","food":["Spiced and blackened cajun chicken","Pork belly vindaloo","Rhubarb pie"],"tips":"Hold the mash for longer at 63-64°C to get more fermentability from the wort."},{"n":45,"name":"The Physics","tagline":"Laid Back Amber Beer.","first":"04/2007","desc":"A hoppy Amber Ale that won World's Best Amber Beer in the World Beer Awards 2007. Malt and hops are in perfect harmony in this incredibly balanced beer. Biscuity, bitter and packing a surprisingly hoppy punch, this beer ultimately morphed into 5AM Saint.","abv":5,"ibu":47,"og":1048.5,"fg":1010,"ebc":65,"ph":4.4,"att":79.4,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Extra Pale",4.06],["Caramalt",0.31],["Crystal 120",0.23],["Dark Crystal",0.94]],"hops":[["Amarillo",25,"grams","start","bitter"],["Amarillo",12.5,"grams","middle","flavour"],["Bramling Cross",12.5,"grams","end","flavour"],["Amarillo",50,"grams","end","flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Barbecue pulled pork on sourdough bread","Roast turkey with a honey and herb marinade and roasted vegetables","Banana walnut loaf with chocolate chips"],"tips":"Keep the fermentation temperature as close to 19°C as possible. This will ensure the yeast creates a more neutral flavour profile, allowing the hops to really shine through."},{"n":46,"name":"Anarchist Alchemist","tagline":"Triple Hopped Triple Ipa.","first":"03/2012","desc":"About as far as you can push an IPA; Anarchist Alchemist packs in three times the malt and three of our favourite hops. Nelson Sauvin, Amarillo and Centennial bring a range of flavours, touching on tropical fruit, white grape, tangerine, grapefruit, pine, spiced orange... the list goes on!","abv":16.5,"ibu":20.5,"og":1112,"fg":1000,"ebc":20,"ph":4.4,"att":100,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":20,"twist":null,"malts":[["Extra Pale",12.5]],"hops":[["Nelson Sauvin",6.25,"grams","start","bitter"],["Centennial",12.5,"grams","start","bitter"],["Nelson Sauvin",12.5,"grams","end","flavour"],["Amarillo",12.5,"grams","end","flavour"],["Centennial",12.5,"grams","end","flavour"],["Nelson Sauvin",12.5,"grams","dry hop","aroma"],["Amarillo",12.5,"grams","dry hop","aroma"],["Centennial",12.5,"grams","dry hop","aroma"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Blue cheese & onion tart","Goan goat curry","Sugar-poached kumquat rice pudding"],"tips":"The biggest challenge with this beer is getting it to ferment out entirely. Hold mash temp at 65°C for 90 mins to ensure maximum fermentability. Use super high gravity yeast or champagne yeast to achieve the last few gravity points."},{"n":47,"name":"AB:15","tagline":"Salted Caramel Popcorn Strong Ale.","first":"03/2013","desc":"A salted caramel popcorn Imperial Ale. Bourbon and Rum barrel aged, this 12.8% ale has complex and twisting flavours. Bitter caramel, wood, smoke, spice, treacle and vanilla are all present and intertwine against a smooth and lightly chewy mouthfeel. The salted caramel popcorn lends subtle hints of a smoky brininess.","abv":12.8,"ibu":50,"og":1096,"fg":1020,"ebc":111,"ph":4.4,"att":79.17,"batchL":20,"boilL":25,"mash":[[68,75]],"ferm":21,"twist":"Adding popped popcorn into the mash, then barrel ageing in fresh bourbon barrels","malts":[["Maris Otter Extra Pale",6.5625],["Caramalt",0.3125],["Munich",1.25],["Crystal 150",0.3125],["Popcorn",0.00625]],"hops":[["Sorachi Ace",62.5,"grams","start","bitter"],["Willamette",25,"grams","end","aroma"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Crispy bacon on flat bread","Glazed ham with crackling coating","Popcorn caramel and chocolate cake"],"tips":"By soaking some oak chips in bourbon, then steeping in the beer you not only get an authentic Bourbon taste - the beer will also gain ABV! Add salt to taste, too much will totally ruin the balance of the beer."},{"n":48,"name":"Goldings - IPA Is Dead","tagline":"Single Hop India Pale Ale.","first":"02/2013","desc":"This is East Kent Goldings re- invented and re-imagined and shows just what can be done with English hops if you use enough of them. In this amped up Goldings reincarnation expect to be slammed with floral lavender, a fruity riot of blackberries and spiced pears, bubblegum, plums and the illusion of thyme.","abv":6.7,"ibu":70,"og":1066,"fg":1015,"ebc":30,"ph":4.4,"att":77.3,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Extra Pale",5],["Caramalt",0.31],["Dark Crystal",0.06],["Munich",0.31]],"hops":[["Goldings",37.5,"grams","start","bitter"],["Goldings",25,"grams","middle","flavour"],["Goldings",37.5,"grams","end","flavour"],["Goldings",125,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Rosemary and thyme marinated venison","Fish and chips","Lavender chocolate chip cookies"],"tips":"Take a read through each year’s hop harvest that is available. Some years are better than others."},{"n":49,"name":"AB:14","tagline":"Oak-Aged Imperial Weizenbock.","first":"02/2013","desc":"Think banoffee pie; loads of creamy sweet banana, and sticky warm toffee. This beer is super complex, and one for the sweet-toothed!","abv":10,"ibu":30,"og":1094,"fg":1016,"ebc":20,"ph":4.4,"att":83,"batchL":20,"boilL":25,"mash":[[65,120]],"ferm":23,"twist":"Oak chips: 25g at end","malts":[["Wheat",5],["Extra Pale",2],["Munich",2],["Caramalt",1.13]],"hops":[["Bramling Cross",30,"grams","start","bitter"],["Simcoe",12.5,"grams","middle","flavour"],["Saaz",15,"grams","middle","flavour"],["Simcoe",12.5,"grams","end","flavour"],["Saaz",15,"grams","end","flavour"]],"yeast":"Wyeast 3638 - Bavarian Wheat™","food":["Sweet pork Chinese dumplings","Caramelised onion venison burger","Banoffee pie"],"tips":"Boil for even longer to get more caramelised flavours in the beer."},{"n":50,"name":"Lost Dog (w/Lost Abbey)","tagline":"Rum-Aged Imperial Porter - Lost Abbey Collab.","first":"11/2011","desc":"Our first beer aged in rum casks, Lost Dog saw us brew a collaboration imperial porter with our friends at Lost Abbey. The base beer was packed with toffee, chocolate and roasty notes, balanced with a subtle spicy hop character. The rum casks add a warming, spiced vanilla edge.","abv":10,"ibu":35,"og":1080,"fg":1012,"ebc":80,"ph":4.4,"att":85,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":"Aged in rum casks for 12 months","malts":[["Extra Pale",4.69],["Pale Chocolate",0.23],["Chocolate",0.7],["Dark Crystal",0.35],["Flaked Oats",0.47],["Caramalt",0.35]],"hops":[["First Gold",35,"grams","start","bitter"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Beef satay skewers","Venison & cranberry pie","Blackberry mocha gateaux"],"tips":"Ageing in barrels brings the ABV up. Recreate rum cask ageing by soaking oak chips in rum then adding to the maturing beer."},{"n":51,"name":"TM10","tagline":"Liquid Art.","first":"04/2010","desc":"Brewed for the Tate Modern’s 10th Anniversary. A saison style beer brewed with ginger and orange peel. Very limited batch of 4000 cork and caged bottles with a silk screened label designed by Johanna Basford. Only available at the Tate Modern.","abv":5.5,"ibu":20,"og":1048,"fg":1005,"ebc":14,"ph":4.2,"att":89.6,"batchL":20,"boilL":25,"mash":[[63,null]],"ferm":22,"twist":null,"malts":[["Pale Ale",5.3]],"hops":[["Bobek",25,"grams","start","bitter"],["Bobek",25,"grams","middle","flavour"],["Bobek",25,"grams","end","flavour"],["Ginger",12.5,"grams","end","flavour"],["Orange Peel",12.5,"grams","end","flavour"]],"yeast":"Wyeast 3711 - French Saison™","food":["Tom yum soup","Andhra chicken pickle curry","Butterscotch tart"],"tips":"For a fresh and fiery hit, put some ginger into the cold conditioning phase as well."},{"n":52,"name":"Paradox Islay","tagline":"Ubiquitous Imperial Stout.","first":"04/2007","desc":"In 2006 James and Martin hijacked a beer dinner run by Michael Jackson, the acclaimed beer and whisky writer, and convinced him to taste one of their home brews. This was a defining moment in BrewDog prehistory, and that beer was the first incarnation of the ubiquitous Paradox. Aged in a variety of casks over the years, Paradox is dark, decadent and encapsulating. Can be enjoyed fresh; phenomenal when aged.","abv":10,"ibu":55,"og":1090,"fg":1014,"ebc":300,"ph":4.4,"att":84.4,"batchL":20,"boilL":25,"mash":[[65,90]],"ferm":21,"twist":"Try ageing on oak chips, infusing with rum raisins, or vanilla pods","malts":[["Extra Pale",4.5],["Caramalt",0.55],["Munich",0.33],["Flaked Oats",1.35],["Dark Crystal",0.55],["Carafa Special Malt Type 1",0.18],["Carafa Special Malt Type 3",0.33]],"hops":[["Columbus",75,"grams","start","bitter"],["Columbus",25,"grams","middle","flavour"],["Saaz",25,"grams","end","flavour"],["First Gold",25,"grams","end","flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Ancho chilli beef taco","Chocolate gateaux","Rum poached pears with dark chocolate sauce"],"tips":"The beauty of this beer is in how brilliantly it lends itself to infusing or ageing. Experiment with different additions when the beer is ageing, taste it regularly to gauge its progress, and make sure you package it at its peak."},{"n":53,"name":"Baby Dogma","tagline":"Session Scotch Ale.","first":"09/2013","desc":"A baby Scotch ale with dry and toasty malt flavours and hints of smoke. Toffee, biscuit and fudge abound with a spicy bitterness from the pan-global hops.","abv":4.5,"ibu":35,"og":1048,"fg":1013,"ebc":40,"ph":4.4,"att":72.9,"batchL":20,"boilL":25,"mash":[[66,75]],"ferm":19,"twist":null,"malts":[["Extra Pale",1.75],["Munich",0.48],["Dark Crystal",0.5],["Wheat",0.56],["Flaked Oats",0.56],["Carafa Special Malt Type 3",0.13],["Amber",0.25],["Weyermann Beech Smoked",0.06]],"hops":[["First Gold",18.5,"grams","start","bitter"],["Willamette",12.5,"grams","start","bitter"],["Hallertauer Mittelfrüh",6,"grams","start","bitter"]],"yeast":"Wyeast 1056 - American Ale™","food":["French onion soup","Braised pheasant","Caramel sauce and hot fudge"],"tips":"The addition of Weyermann Beech Smoked malt creates a beer with a delicate smoke character."},{"n":54,"name":"Albino Squid Assasin","tagline":"Red Rye IPA","first":"11/2015","desc":"This tentacled terminator packs a punch - ten punches to be precise. Each hop addition adds to the intense layers of depth in this red rye IPA. Toasty caramel & cinder toffee from crystal malts, cacao richness from intensely roasted malt and the spiciness of rye. Zesty pithiness from Citra and the robust resin of Chinook. This small batch exclusive brew is up-front intensity matched with twisted complexity. The can features awesome custom art from Joe Wilson.","abv":7.4,"ibu":65,"og":1069,"fg":1012,"ebc":60,"ph":4.2,"att":82.6,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":18,"twist":null,"malts":[["Pale Ale",5],["Crystal 150",0.38],["Dark Crystal",0.13],["Carafa Special Malt Type 1",0.06],["Rye",0.5]],"hops":[["Magnum",12.5,"grams","start","bitter"],["Chinook",25,"grams","middle","flavour"],["Citra",6.25,"grams","middle","flavour"],["Chinook",37.5,"grams","end","flavour"],["Citra",18.75,"grams","end","flavour"],["Chinook",100,"grams","fv","aroma"],["Citra",75,"grams","fv","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Rocket and mozzarella salad with a cracked pepper dressing","Fried halibut with sweet potato fritters","Grapefruit and blood orange tart"],"tips":"20% specialty malts in this grist can create problems in the run off. Be careful not to pull the bed down onto the plates."},{"n":55,"name":"Amarillo - IPA Is Dead","tagline":"Single Hop India Pale Ale.","first":"01/2013","desc":"Citrus fruit. Lots of citrus fruit. Think blood orange, orange zest and grapefruit, tangerine and lemon; the fruit is balanced by floral notes in the most classic of new wave IPA hops. Amarillo adds a zesty, pithy character that sits beautifully alongside hints of toffee and honeycomb.","abv":7.2,"ibu":70,"og":1067,"fg":1012,"ebc":30,"ph":4.4,"att":82.1,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":19,"twist":null,"malts":[["Extra Pale",4.88],["Caramalt",0.31],["Dark Crystal",0.06]],"hops":[["Amarillo",20,"grams","start","bitter"],["Amarillo",25,"grams","middle","flavour"],["Amarillo",37.5,"grams","end","flavour"],["Amarillo",250,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Bratwurst sausage with spicy mustard","Fried American bacon with chilli flakes added to the top","Dark chocolate chip cookies"],"tips":"Use the freshest hops for the most impact. It seems obvious but in a single hop beer, you want the hops to be at their best."},{"n":56,"name":"Black Eyed King Imp","tagline":"Barrel-Aged Prototype Cocoa Psycho.","first":"11/2012","desc":"An early Cocoa Psycho recipe that we loved, but didn't fit what we were looking for. We locked this chocolate coffee stout away in barrels for two years, imparting toasted marshmallow, spicy vanilla, molasses and boozy warmth.","abv":9.5,"ibu":85,"og":1095,"fg":1022,"ebc":250,"ph":4.4,"att":76.8,"batchL":20,"boilL":25,"mash":[[65,50]],"ferm":18,"twist":"Coffee Beans: 12.5g at end, Lactose: 125g","malts":[["Extra Pale - Spring Blend",6.25],["Wheat",1.25],["Caramalt",1.25],["Crystal",1.56],["Dark Crystal",0.63],["Amber",0.63],["Brown",0.63],["Chocolate",0.63],["Roasted Barley",0.31]],"hops":[["Magnum",62.5,"grams","start","bitter"],["Willamette",31.25,"grams","end","flavour"],["First Gold",31.25,"grams","end","flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Beef chilli made with cocoa powder","Dark chocolate covered bacon","Rich espresso tiramisu"],"tips":"There is a huge amount of roasted malts in this grist. Be careful not to pulverise the malt into powder during the milling process."},{"n":57,"name":"Prototype 27","tagline":"Vibrant Smoky Pink IPA.","first":"04/2010","desc":"Hardcore IPA with raspberries aged in Caol Ila casks. Full-bodied and compelling, the robust malt base provides an initial layer of honey, cinnamon and biscuity malt sweetness. Soon the Scottish berries are in on the act, a dominating tug of war between sweet and tart with an overbearing zest. As the beer slips back across your tongue the hops demand and definitely get your attention. At 100 IBUs the bitterness smashes into the back of your throat as the resinous, spiced orange peel flavours add depth to the berry fruitiness.","abv":9.2,"ibu":149,"og":1083,"fg":1014,"ebc":19.5,"ph":4.4,"att":83,"batchL":20,"boilL":25,"mash":[[65,90]],"ferm":19,"twist":null,"malts":[["Pale Ale",8.13],["Crystal 150",0.28],["Caramalt",0.56]],"hops":[["Columbus",50,"grams","start","bitter"],["Centennial",50,"grams","start","bitter"],["Columbus",12.5,"grams","middle","flavour"],["Centennial",12.5,"grams","middle","flavour"],["Columbus",37.5,"grams","end","flavour"],["Centennial",37.5,"grams","end","flavour"],["Simcoe",37.5,"grams","end","flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Strong blue cheese","Cranachan","Chicago style hot links"],"tips":"Soak some oak chips in Caol Ila whisky to get barrel character. Freeze raspberries before adding them to secondary."},{"n":58,"name":"Coffee Imperial Stout","tagline":"Beats a Cup of Joe.","first":"11/2008","desc":"This beer was released as both as \\"Danish Beerhouse Coffee Imperial Stout\\" and \\"BrewDog Coffee Imperial Stout\\". Deep, dark, roasted flavours make this a perfect Sunday brunch beer.","abv":9,"ibu":65,"og":1080,"fg":1019,"ebc":97,"ph":4.4,"att":76,"batchL":20,"boilL":25,"mash":[[64,90]],"ferm":19,"twist":"Coffee added after boil. Aged on French oak chips., Dark muscovado sugar: 312.5g for 20mins","malts":[["Extra Pale",7.5],["Dark Crystal",0.63],["Chocolate",0.31],["Roasted Barley",0.31]],"hops":[["Chinook",25,"grams","start","bitter"],["Galena",25,"grams","start","bitter"],["Galena",25,"grams","end","flavour"],["First Gold",25,"grams","end","flavour"],["Coffee",9.4,"grams","end","flavour"],["Coffee",9.4,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Gooey chocolate brownies","Chicken fried steak with cheesy mash","Spicy chicken empanadas"],"tips":"Grind the coffee as if making an espresso to really get the most out of it."},{"n":59,"name":"Mandarina Bavaria - IPA Is Dead","tagline":"Single Hop India Pale Ale.","first":"03/2015","desc":"From the central European plains of Germany, comes something very different. A blast of tangerine and orange, Mandarina Bavaria brings a highly distinctive backbone of flavour. This is down to its parent – Cascade – and a frankly enormous 70% myrcene oil content. If equate Germany solely with earthy, spicy Noble hops, Mandarina Bavaria will make you think again.","abv":7.2,"ibu":100,"og":1064,"fg":1010,"ebc":12,"ph":4.4,"att":84,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Extra Pale",6.39]],"hops":[["Mandarina Bavaria",41.5,"grams","start","bitter"],["Mandarina Bavaria",41.5,"grams","middle","flavour"],["Mandarina Bavaria",41.5,"grams","end","flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Lavender and thyme roast beef","Spicy kung po chicken","Caramel and rose essence cheesecake"],"tips":"We've mentioned the importance of fresh hops previously but this one really demands that your hops are the absolute freshest."},{"n":60,"name":"Dogma","tagline":"Revamped Wee Heavy. Luscious. Malty. Fruity.","first":"07/2013","desc":"Brewed with over ten different types of malt, and blended together with Scottish heather honey, it is a pantheon to the gods of intricacy and nuance; a beer that celebratesa confluence of ideas. Complex, indulgent and encapsulating, Dogma gives more than a cursory nod to history, to make you ponder the very nature of beer itself.","abv":7.5,"ibu":30,"og":1080,"fg":1023,"ebc":46,"ph":4.5,"att":70,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":12,"twist":"Heather Honey: 125g","malts":[["Pale Ale",3.5],["Munich",0.75],["Caramalt",0.5],["Crystal",0.38],["Dark Crystal",0.5],["Wheat",1],["Flaked Oats",1],["Chocolate",0.25],["Smoked Malt",0.06],["Amber",0.25],["Brown",0.25]],"hops":[["Saaz",75,"grams","start","bitter"],["First Gold",10,"grams","start","bitter"]],"yeast":"Wyeast 2007 - Pilsen Lager™","food":["Mature cheddar with red onion chutney","Honey glazed ham","Chocolate caramel drizzled sponge cake"],"tips":"There's a lot of specialty malt in the mash. Make sure you take the run off nice and steady – increase the flow too much and pull in the bed at your peril."},{"n":61,"name":"Magic Stone Dog (w/Magic Rock & Stone Brewing Co.)","tagline":"Session Farmhouse IPA - Stone / Magic Rock Collab.","first":"06/2014","desc":"A session IPA brewed with a diverse grain bill, hopped with Simcoe and Amarillo and fermented with saison yeast, for an incredible level of depth in a low ABV beer. Spicy, fruity, complex, refreshing and dry.","abv":4.6,"ibu":30,"og":1043,"fg":1008,"ebc":15,"ph":4.4,"att":81.4,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":23,"twist":"Cumin: 0.5g at end, Caraway: 1g at end, Peppercorns (Pink): 5g at end, Grains of Paradise: 5g at end","malts":[["Extra Pale",2.38],["Wheat",0.44],["Torrified Wheat",0.44],["Rye",0.19],["Flaked Oats",0.44],["Amber",0.19]],"hops":[["Simcoe",25,"grams","end","flavour"],["Amarillo",25,"grams","end","flavour"]],"yeast":"Wyeast 3711 - French Saison™","food":["Halibut with caper brown butter","Creamy gorgonzola and satsuma salad","Spicy Daal with garlic naan bread"],"tips":"Start the fermentation off at 20 ̊C and allow it to rise as high as 25 ̊C. This will increase the fruity character of the yeast."},{"n":62,"name":"AB:08","tagline":"Deconstructed Blonde Imperial Stout.","first":"11/2011","desc":"Flavours and aromas you'd expect from a Stout, but brewed without dark malts. The full mouthfeel comes courtesy of wheat and oats, while smoked malt and the twist additions add the complex flavours normally provided by highly kilned malts.","abv":10.43,"ibu":65,"og":1095,"fg":1016,"ebc":23,"ph":4.4,"att":83.2,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":21,"twist":"Cacao: 25g at FV, Coffee Beans: 37.5g at FV, Oak Chips: 5g at FV, Vanilla Pods: 10 split pods, Liquorice: 5g at FV","malts":[["Maris Otter Extra Pale",9.25],["Wheat",1.88],["Flaked Oats",1.88],["Smoked Peaty",0.13]],"hops":[["First Gold",81.25,"grams","start","bitter"],["First Gold",62.5,"grams","end","flavour"],["Coffee Beans",12.5,"grams","end","flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Caramelised scallops with burnt apple puree","Blackened Cajun chicken","Blondies with chocolate fudge sauce"],"tips":"Add all twist ingredients to Fermentation Vessel once fermentation is complete. Don’t be afraid to add a little at a time and taste as you go. During mashing in first start with pale malt. Afterwards mix r"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Quince cheese","Shredded chicken and mango salsa taquitos","Poached pear"],"tips":"After the beer has fermented, leave it to rest for 2 – 3 days at the lowest temperature possible (ideally 0 – 2'C). This will allow the flavours to marry together, and will transform it into a balanced and amazing beer."},{"n":69,"name":"AB:16","tagline":"Coffee-Infused Belgian Quad.","first":"02/2014","desc":"On the nose, clove and nutmeg, cafe au lait, subtle dark fruit notes, and hints of candied lemon peel. On the palate, smooth & fruity espresso, milk chocolate, and warm brandy-soaked currants are in the middle of a high-class dance-off against the spicy and peppery Belgian character. The overall impression evokes malt loaf or ginger cake.","abv":10.6,"ibu":55,"og":1090,"fg":1012,"ebc":30,"ph":4.4,"att":86.7,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":21,"twist":"Coffee Beans: 250g FV. Raisins: 90g at end. Dark Sugar:140g at end.","malts":[["Extra Pale",7.75],["Wheat",0.5],["Munich",0.5],["Crystal 150",0.38],["Chocolate",0.13]],"hops":[["Waimea",15,"grams","start","bitter"],["Saaz",12.5,"grams","middle","flavour"],["Fuggles",12.5,"grams","middle","flavour"]],"yeast":"Wyeast 3787 - Trappist High Gravity™","food":["Roasted duck","Gorgonzola and rye nut bread with smoked honey ham","Raspberry coffee cheesecake"],"tips":"For the traditional cellering, age this beer in vessel or bottle for 2 - 3 months at cellar temperature."},{"n":70,"name":"Sunmaid Stout","tagline":"Rum & Raisin Imperial Stout.","first":"12/2011","desc":"Brewed by Chris Sartori from Stone Brewing Company in 2010. A dark chocolate stout with dried dark fruit finish. Simcoe provides bitterness with subtle fruity supporting notes, contrasting the chocolate and coffee-laden malt profile. The finish is warming with vanilla and rich dark fruit depth.","abv":10.2,"ibu":50,"og":1026,"fg":1102,"ebc":197,"ph":4.4,"att":74.5,"batchL":20,"boilL":25,"mash":[[65,55]],"ferm nally grown in the US around 40 years ago, Comet has been newly resurrected - this German version has bold resinous grapefruit flavours, which add a huge fresh hop aroma to this IPA.","abv":7.2,"ibu":70,"og":1067,"fg":1012,"ebc":30,"ph":4.4,"att":82.1,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":19,"twist":null,"malts":[["Extra Pale",5.65],["Caramalt",0.31],["Dark Crystal",0.06]],"hops":[["Comet",15,"grams","start","bitter"],["Comet",25,"grams","middle","flavour"],["Comet",37.5,"grams","end","flavour"],["Comet",250,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Margherita pizza with chili flakes","Spicy Thai peanut satay","Panna cotta with a grapefruit tuile"],"tips":"Experiment with other high alpha hops during dry-hop to discover their aroma and flavour characteristics."},{"n":84,"name":"Baby Saison - B-Sides","tagline":"Trial Baby Saison.","first":"08/2015","desc":"A hark back to the origins of Saison; slight spice and earthy notes with highlights of lemon and pepper make a beer that could quench the thirst of any seasonal worker.","abv":3.6,"ibu":9,"og":1032,"fg":1004,"ebc":2,"ph":4.4,"att":88,"batchL":20,"boilL":25,"mash":[[60,10],[65,30],[72,10],[78,5]],"ferm":21,"twist":null,"malts":[["Pilsner",5.4],["Munich",0.13],["Amber",0.05]],"hops":[["Sorachi Ace",6.5,"grams","start","bitter"],["Sorachi Ace",6.5,"grams","end","flavour"],["Mosaic",6.5,"grams","end","flavour"],["Amarillo",6.5,"grams","end","flavour"]],"yeast":"Wyeast 3711 - French Saison™","food":["Pork chop with rosemary chips","Steak tartare","Belgian waffles"],"tips":"Ferment between 21 and 24°C to get this saison as dry as possible."},{"n":85,"name":"Santa Paws","tagline":"Christmas Scoth Ale.","first":"10/2010","desc":"A 4.5% decadent scotch ale brewed with Scottish heather honey. A robust malty beer packed with flavour, at a strength you can drink all (Christmas) day long. Santa Paws is our antidote to the chaos of the festive season. All the flavours of Christmas pudding in liquid form.","abv":4.5,"ibu":35,"og":1048,"fg":1013,"ebc":44,"ph":4.4,"att":72.9,"batchL":20,"boilL":25,"mash":[[66,75]],"ferm":19,"twist":null,"malts":[["Extra Pale",1.75],["Munich",0.44],["Dark Crystal",0.5],["Wheat",0.56],["Flaked Oats",0.56],["Carafa Special Malt Type 3",0.13],["Amber",0.25],["Weyermann Beech Smoked",0.63]],"hops":[["First Gold",18.5,"grams","start","bitter"],["Willamette",12.5,"grams","start","bitter"],["Hallertauer Mittelfrüh",6.5,"grams","start","bitter"]],"yeast":"Wyeast 1056 - American Ale™","food":["French onion soup","Braised pheasant","Caramel sauce and hot fudge"],"tips":"The addition of Weyermann Beech Smoked malt creates a beer with a delicate smoke character."},{"n":86,"name":"Original Dogma (Née Speedball)","tagline":"Strong Ale With Honey And Spices.","first":"07/2008","desc":"A strong ale, brewed with guarana, Californian poppy, kola nut and Scottish heather honey. A conspiracy of trans-continental ingredients infused with some devastatingly BrewDog imaginative thinking.","abv":7.8,"ibu":60,"og":1071.3,"fg":1012,"ebc":31,"ph":4.3,"att":83.2,"batchL":20,"boilL":25,"mash":[[64,75]],"ferm":21,"twist":"Herb and honey addition","malts":[["Extra Pale",4.5],["Munich",0.5],["Amber",0.05],["Dark Crystal",0.08]],"hops":[["Amarillo",30,"grams","start","bitter"],["Amarillo",10,"grams","end","flavour"],["Bobek",10,"grams","end","flavour"],["Guarana Powder",6,"grams","end","flavour"],["Kola Nut Powder",6,"grams","end","flavour"],["Poppy Seed",6,"grams","end","flavour"],["Heather Honey",100,"grams","end","flavour"]],"yeast":"Safale US-05","food":["Spicy seafood stew","French onion soup","Mexican wedding cake (cookies)"],"tips":"Get really good quality heather honey, the more aromatic the better. Honey is 100% fermentable, but it does have a huge influence on the ester profile of the beer – in this case high floral esters."},{"n":87,"name":"Alpha Pop","tagline":"Hoppy Rye Pale Ale.","first":"03/2014","desc":"A hoppy Rye Ale loaded with an avalanche of citrus and resinous flavours. Columbus, our high-alpha friend, lends a huge pithy citrus blast, with Ahtanum providing a punchy tropical fruit back-up. Brewing with rye adds a spiciness to the speciality malt caramel backbone, giving a warm ginger snap flavour, before slowly the hops, barley and rye combine and build to an orangey, biscuity, almost chocolatey crescendo.","abv":4.5,"ibu":30,"og":1045,"fg":1011,"ebc":25,"ph":4.4,"att":75.6,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":19,"twist":null,"malts":[["Extra Pale",3.69],["Caramalt",0.16],["Dark Crystal",0.06],["Rye",0.31]],"hops":[["Columbus",5,"grams","start","bitter"],["Columbus",7.5,"grams","middle","flavour"],["Ahtanum",12.5,"grams","middle","flavour"],["Ahtanum",37.5,"grams","end","flavour"],["Ahtanum",125,"grams","dry hop","aroma"],["Columbus",125,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Spicy lamb tikka masala","Spicy beef and Mexican black bean burger","Poached cinnamon apple muffins"],"tips":"Columbus and Ahtanum hop additions create a perfect blend of resin and lemon character."},{"n":88,"name":"Bavarian Weizen","tagline":"Unleash the Yeast Series.","first":"09/2013","desc":"Our Unleash the Yeast series was an epic experiment into the differences in aroma and flavour provided by switching up your yeast. We brewed up a wort with a light caramel note and some toasty biscuit flavour, and hopped it with Amarillo and Centennial for a citrusy bitterness. Everything else is down to the yeast. Bavarian Weizen yeast adds traditional weissbier notes of banana and clove.","abv":6.3,"ibu":55,"og":1060,"fg":1012,"ebc":30,"ph":4.4,"att":80,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":22,"twist":null,"malts":[["Extra Pale",4.58],["Caramalt",0.25],["Dark Crystal",0.06],["Munich",0.25]],"hops":[["Centennial",5,"grams","start","bitter"],["Amarillo",5,"grams","start","bitter"],["Centennial",10,"grams","middle","flavour"],["Amarillo",10,"grams","middle","flavour"],["Centennial",17.5,"grams","end","flavour"],["Amarillo",17.5,"grams","end","flavour"]],"yeast":"WLP351 - Bavarian Weizen","food":["Spicy paella","German bratwurst with spicy mustard dip and vinaigrette salad","Creamy eggs benedict"],"tips":"Play around with the fermentation temperature to get the best flavour profile from the individual yeasts."},{"n":89,"name":"Citra","tagline":"Single Hop IPA Series – 2011.","first":"01/2011","desc":"The Pacific North West of America is home to the Citra hop. America is not just about cheer leaders, a silly version of football, elastic top jeans and cheeseburgers. They grow remarkable hops and Citra is a killer example of this, embodying all that is good about American hops and then some. Fearfully hard to resist, this beer is loaded with brash citrus, grapefruit, orange, hints of resinous pine and touches of blackcurrant. Devilishly moreish.","abv":7.5,"ibu":70,"og":1068,"fg":1013,"ebc":30,"ph":4.4,"att":82.1,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":19,"twist":null,"malts":[["Extra Pale",6.38],["Crystal 150",0.13],["Caramalt",0.25]],"hops":[["Citra",2.5,"grams","start","bitter"],["Citra",10,"grams","middle","flavour"],["Citra",37.5,"grams","end","flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Lemon and herb salmon","Sharp cheddar with mango chutney","Shredded chicken tacos with pico de gallo"],"tips":"Another hop to be treated with respect. Too much in the kettle or dry hop will turn the beer into a garlicky disaster."},{"n":90,"name":"#Mashtag 2015","tagline":"US Hopped Black Barley Wine.","first":"05/2015","desc":"Democratically voted on by you and the BrewDog beer community. A wonderfully burnt toast malt backbone, loaded with American Hops for floral, citrus flavours and warm boozy vanilla and toasted oak.","abv":10,"ibu":85,"og":1098,"fg":1020,"ebc":130,"ph":4.4,"att":79.6,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":21,"twist":"Oak Chips: 38.5g at FV, Vanilla Pods at FV","malts":[["Pale Ale",6.35],["Munich",0.77],["Caramalt",0.96],["Special W",0.29],["Carafa Special Malt Type 1",0.38],["Carafa Special Malt Type 3",0.19]],"hops":[["Nugget",19,"grams","start","bitter"],["Columbus",38.5,"grams","start","bitter"],["Centennial",19,"grams","middle","flavour"],["Simcoe",19,"grams","middle","flavour"],["Centennial",19,"grams","end","flavour"],["Simcoe",19,"grams","end","flavour"],["Willamette",19,"grams","end","flavour"],["Centennial",38.5,"grams","dry hop","aroma"],["Simcoe",38.5,"grams","dry hop","aroma"],["Willamette",38.5,"grams","dry hop","aroma"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Charcuterie platter (featuring Italian salami)","Blue cheese wedge salad","Rich dark chocolate volcano cake"],"tips":"Steep the oak chips and vanilla in separate bags in the cold conditioning phase. Taste every 2 - 3 days and as soon as profile is desirable they can be removed easily."},{"n":91,"name":"Dead Pony Club","tagline":"West Coast Kicks. Citrusy. Zesty. Bright.","first":"03/2012","desc":"Our California style West Coast IPA has light toffee and caramel notes layered on biscuit malt, supporting a huge, fresh citrus aroma, with lemongrass, lime zest, grapefruit peel, alongside some tropical notes, courtesy of some heavy-hitting US hops.","abv":3.8,"ibu":35,"og":1040,"fg":1012,"ebc":25,"ph":4.4,"att":70,"batchL":20,"boilL":25,"mash":[[62,75]],"ferm":19,"twist":null,"malts":[["Extra Pale",2.79],["Caramalt",0.63],["Crystal 150",0.19]],"hops":[["Simcoe",5,"grams","start","bitter"],["Citra",5,"grams","start","bitter"],["Simcoe",5,"grams","middle","flavour"],["Citra",5,"grams","middle","flavour"],["Simcoe",50,"grams","dry hop","aroma"],["Citra",75,"grams","dry hop","aroma"],["Mosaic",62.5,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Baja style fish tacos","Jerk chicken","Apple crumble"],"tips":"It may be tempting to throw extra (extra) hops at Dead Pony Club, but try adding a little at a time to consecutive brews rather than cramming in loads al Red Saison.","first":"06/2013","desc":"This French white wine barrel aged Imperial Saison has a plethora of intertwining flavours. Huge aromas of peach, syrup, tangerine, sherry, toffee and raisin, followed by a dynamic bracing acidity.","abv":10.5,"ibu":45,"og":1081,"fg":1005,"ebc":15,"ph":4.4,"att":93.8,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":23,"twist":"Coriander seeds: 12.5g at End (WP), Orange: 25g at End (WP), Lemon: 25g at End (WP), Honey: 125g at End (WP), Pink Peppercorns: 3.5g at End (WP)","malts":[["Extra Pale",6.13],["Caramalt",0.38],["Wheat",0.25],["Rye",0.25]],"hops":[["Motueka",25,"grams","start","bitter"],["Saaz",12.5,"grams","middle","flavour"],["Bobek",12.5,"grams","middle","flavour"],["Saaz",12.5,"grams","end","flavour"],["Bobek",12.5,"grams","end","flavour"]],"yeast":"Wyeast 3711 - French Saison™","food":["Spiced carrot and coriander soup","Spicy chilli king prawns","Orange zest tart"],"tips":"The honey addition will help to dry out the beer, as the saison yeast will continue to ferment long after most ale yeast."},{"n":95,"name":"Peroxide Punk","tagline":"Zesty Pale Ale.","first":"04/2007","desc":"A trashy blonde concession for those who felt that our original 6% Punk IPA recipe was too hard hitting. This was also the first time we experimented with dry hopping our beers, giving Peroxide Punk a depth of flavour that belies its modest ABV. Zesty, aromatic and thirst quenching.","abv":4,"ibu":40,"og":1039,"fg":1009,"ebc":18,"ph":4.4,"att":76.9,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Maris Otter",3.85]],"hops":[["Amarillo",25,"grams","start","bitter"],["Simcoe",20,"grams","end","flavour"],["Amarillo",25,"grams","end","flavour"],["Crystal",20,"grams","end","flavour"],["Liberty",20,"grams","end","flavour"],["Simcoe",50,"grams","dry hop","aroma"],["Amarillo",50,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Sashimi","Pan roasted poussin with spring veg","Lemon and thyme panna cotta"],"tips":"During the mashing process, try to mix the malt without 'turning' or splashing too much. This will cause more oxygen to be dissolved in the mash - and result in a beer that will taste a little like a cardboard box."},{"n":96,"name":"Lumberjack Stout","tagline":"Blueberry Bacon Stout.","first":"12/2013","desc":"Lumberjack Stout is an intense beast that took its inspriation from what an actual bona-fide lumberjack might have for breakfast. Flavours of molasses, chocolate, smoke, berry, coffee and more, with a low bitterness, leaning this beer firmly towards the malty side.","abv":15.2,"ibu":20,"og":1110,"fg":1020,"ebc":158,"ph":4.4,"att":82,"batchL":20,"boilL":25,"mash":[[65,105]],"ferm":21,"twist":"Blueberries, maple syrup and coffee, then aged in ex Grain whisky casks. Maple Syrup: 50g at end. Blueberries: 100g at middle.","malts":[["Extra Pale",10.63],["Carafa Special Malt Type 3",1.25],["Flaked Oats",2.19],["Smoked Malt",0.63],["Crystal",1.25]],"hops":[["Galena",36,"grams","start","bitter"],["Willamette",37.5,"grams","end","flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Maple syrup drizzled chocolate chip pancakes","Fried bacon with crispy honeycomb bits","Coffee cake"],"tips":"Adding extra smoked malt will amp up the bacon character."},{"n":97,"name":"Bowman's Beard - B-Sides","tagline":"English Barley Wine.","first":"03/2015","desc":"Ice-distilled double barley wine brewed by Chris from Stone Brewing Co. (see Sunmaid Stout) and BrewDog's own brewers. As robust, resinous and badass as its eponymic beard.","abv":18.3,"ibu":50,"og":1067,"fg":1011,"ebc":15,"ph":5.3,"att":84,"batchL":20,"boilL":25,"mash":[[65,90]],"ferm":19,"twist":"Ice-distilled after fermentation to get to 18.3%","malts":[["Extra Pale",4.5],["Rye",0.5],["CaraAroma",0.04],["Caramunich",0.1],["Brown",0.25],["Caramalt",0.13],["Crystal",0.07],["Munich",0.11]],"hops":[["Motueka",10,"grams","start","bitter"],["First Gold",10,"grams","start","bitter"],["Galena",10,"grams","start" t","malts":[["Extra Pale",4.5],["Caramalt",0.88]],"hops":[["Magnum",2.5,"grams","start","bitter"],["Simcoe",12.5,"grams","middle","flavour"],["Amarillo",12.5,"grams","middle","flavour"],["Mosaic",25,"grams","end","flavour"],["Citra",25,"grams","end","flavour"],["Amarillo",12.5,"grams","end","flavour"],["Simcoe",12.5,"grams","end","flavour"],["Citra",50,"grams","dry hop","aroma"],["Amarillo",50,"grams","dry hop","aroma"],["Simcoe",50,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Mexican ceviche","Coriander and lime green thai curry","Grapefruit souffle"],"tips":"Shave of the surface of the citrus peel to unlock the highly aromatic compounds into the beer. Avoid putting any white pith into the brew as it will create an intense and unpleasant bitterness."},{"n":101,"name":"Riptide","tagline":"Twisted Merciless Stout.","first":"04/2007","desc":"The original BrewDog, Bracken decided to make a beer that best reflected himself; this is the beer equivalent of the big, cute chocolate monster. Soft, smooth, dark, chocolatey and a force to be reckoned with. This gentle giant will never bite, but you'll still want to be on your best behaviour!","abv":8,"ibu":45,"og":1075,"fg":1014,"ebc":240,"ph":4.4,"att":81.3,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":20,"twist":"Dark muscavado sugar 285g 30mins pre boil end","malts":[["Maris Otter Extra Pale",5.36],["Dark Crystal 350-400",0.71],["Carafa Special Malt Type 3",0.18],["Caramalt",0.54],["Chocolate",0.25],["Wheat",0.36],["Flaked Oats",0.54]],"hops":[["Columbus",14.3,"grams","start","bitter"],["Galena",14.3,"grams","start","bitter"],["Galena",21.4,"grams","start","bitter"],["Cascade",21.4,"grams","end","flavour"],["Columbus",21.4,"grams","end","flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Seared scallops","Pan seared venison with fruit salad side","Caramelised apple pie with vanilla ice cream"],"tips":"We recommend adding the chocolate malt at the start of the run off to ensure you extract the flavour and colour without imparting too much of the astringency of the malt into your wort. This will give the beer a really smooth mouthfeel, making this dangerously drinkable at 8% ABV."},{"n":102,"name":"Peach Therapy","tagline":"Tart Belgian Tripple.","first":"06/2015","desc":"9% abv sour tripel, infused with peach and apricot in collaboration with some of our favourite beer writers Adrian Tierney-Jones, Matt Curtis and Jonny and Brad from The Craft Beer Channel.","abv":9,"ibu":30,"og":1071,"fg":1000,"ebc":12,"ph":3.6,"att":87,"batchL":20,"boilL":25,"mash":[[60,10],[65,30],[72,10],[78,5]],"ferm":20,"twist":null,"malts":[["Extra Pale",14.5]],"hops":[["Mandarina Bavaria",7.5,"grams","start","bitter"],["Strisselspalt",7.5,"grams","start","bitter"],["Mandarina Bavaria",25,"grams","end","flavour"],["Strisselspalt",25,"grams","end","flavour"]],"yeast":"Wyeast 3522 - Belgian Ardennes™","food":["Summer salad with pickled veg","Sticky barbecue spare ribs","Blueberry and almond tart"],"tips":"20% of the original volume of wort was brewed again, kettle soured and added during fermentation to give a tart finish to the beer."},{"n":103,"name":"Clown King","tagline":"US Style Barley Wine.","first":"12/2013","desc":"A heavy hitting combination of rich malt flavours and relentless, bitter hops. Aromas of caramel and toasted marshmallow, with raisin and dried fruit, alongside a spicy undercurrent of resin. With toasty malt and sweet dark fruit flavours, and a smooth, chewy mouthfeel, you’ll be lulled into a false sense of security, before the intense pine-sap resin draws out a huge bitter finish.","abv":12,"ibu":85,"og":1130,"fg":1020,"ebc":24,"ph":4.4,"att":102.3,"batchL":20,"boilL":25,"mash":[[65,90]],"ferm":21,"twist":null,"malts":[["Extra Pale",9.5],["Caramalt",0.5],["Crystal 150",0.13],["Brown",0.25],["Munich",0.88]],"hops":[["Magnum",25,"grams","start","bitter"],["Simcoe",18.5,"grams","middle","flavour"],["Mosaic",12.5,"grams","middle","flavour"],["Ahtanum",18.5 se is down to the yeast. American Ale used a clean fermenting strain which provides some faint fruity notes.","abv":6.3,"ibu":55,"og":1060,"fg":1012,"ebc":30,"ph":4.4,"att":80,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":19,"twist":null,"malts":[["Extra Pale",4.58],["Caramalt",0.25],["Dark Crystal",0.06],["Munich",0.25]],"hops":[["Centennial",5,"grams","start","bitter"],["Amarillo",5,"grams","start","bitter"],["Centennial",10,"grams","middle","flavour"],["Amarillo",10,"grams","middle","flavour"],["Centennial",17.5,"grams","end","flavour"],["Amarillo",17.5,"grams","end","flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Fried brie bites","American cheese burger","Poached apple tart"],"tips":"Play around with the fermentation temperature to get the best flavour profile from the individual yeasts."},{"n":109,"name":"Cocoa Psycho","tagline":"Russian Imperial Stout. Rich. Decadent. Mocha.","first":"11/2012","desc":"Vanilla pods and toasted oak chips add a rounded character to this massive Russian Imperial Stout, brewed with a hefty malt bill, cacao nibs and coffee beans. Dark malts combine with Cascade to add a punchy bitterness, strong enough to offset the big chocolate sweetness.","abv":10,"ibu":85,"og":1098,"fg":1012,"ebc":30,"ph":4.4,"att":70,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":21,"twist":"Coffee Beans: 25g at end, Cocoa Nibs: 25g at end, Cocoa Nibs: 25g at conditioning, Coffee Beans: 25g at conditioning, Oak Chips: 15g at conditioning","malts":[["Extra Pale",6.88],["Wheat",1],["Dark Crystal",0.13],["Black Malt",1.25],["Roasted Barley",1.5],["Weyermann Smoked",0.5]],"hops":[["Cascade",75,"grams","start","bitter"],["Cascade",25,"grams","middle","flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Smokey sweet pulled brisket","Espresso crusted venison with a dark cherry jus","Affogato with vanilla ice cream"],"tips":"Put coffee beans and cocoa nibs in a cheese cloth and dip in wort like a tea bag. Do multiple small additions for short
