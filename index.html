on of the acidulated malt tweaks the pH down to aid the yeast fermentation, and helps to creates the crisp lager bite. Be careful not to use more than 10% in any grist, it will turn your mash into jelly!"},{"n":112,"name":"Vote Sepp","tagline":"Witbier With Hibiscus.","first":"05/2014","desc":"Vote Sepp is a single hop wheat beer brewed to a session strength, with hibiscus flower, which gives it an impressively vibrant shade of pink. What Vote Sepp lacks in complexity, it more than makes up for in a perfect balance of tartness, bitterness and body.","abv":3.6,"ibu":20,"og":1036,"fg":1009,"ebc":8,"ph":4.1,"att":75,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":21,"twist":"Hibiscus: 37.5g Tank","malts":[["Extra Pale",2.5],["Torrified Wheat",0.69]],"hops":[["Motueka",5,"grams","start","bitter"],["Motueka",12.5,"grams","middle","flavour"],["Motueka",12.5,"grams","end","flavour"]],"yeast":"Wyeast 3944 - Belgian Witbier™","food":["Crab roll sushi with strawberries","Artichoke hearts and chicken melt","Caprese salad (mozzarella, tomato, basil, black pepper and sea salt)"],"tips":"Load hibiscus in the hot wort in a tea bag."},{"n":113,"name":"Hello My Name Is Ingrid","tagline":"Sophisticated Bergmanesque Beer.","first":"12/2010","desc":"A Double IPA with cloudberries added to the conditioning tank. One thing is certain – this Swedish inspired Double IPA is not as innocent as she first appears. A seductive body of rich malts and a buxom amount of Citra, Nelson Sauvin and Bramling Cross hops have been added to fresh Scandinavian cloudberries to deliver this beer’s tart finish.","abv":8.2,"ibu":42,"og":1078,"fg":1013,"ebc":70,"ph":4.4,"att":83.3,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":22,"twist":"Cloudberries: 1kg","malts":[["Maris Otter Extra Pale",6.86],["Caramalt",0.93]],"hops":[["Columbus",25,"grams","start","bitter"],["Centennial",25,"grams","start","bitter"],["Columbus",12.5,"grams","end","flavour"],["Centennial",12.5,"grams","end","flavour"],["Nelson Sauvin",25,"grams","end","flavour"],["Bramling Cross/ First Gold",37.5,"grams","end","flavour"],["NZ Nelson Sauvin",71.5,"grams","dry hop","aroma"],["Bramling Cross",71.5,"grams","dry hop","aroma"],["Simcoe",71.5,"grams","dry hop","aroma"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Crayfish with a chilli, coriander infused butter dip","Smörgås with cream topping","Cardamom cake with powder sugar and cloudberry jam"],"tips":"Add the cloudberries to your beer when racking the beer after primary fermentation. Grind them into a paste to allow maximum flavour extraction."},{"n":114,"name":"U-Boat (w/ Victory Brewing)","tagline":"Smoked Porter Collab With Victory Brewing.","first":"07/2014","desc":"On the palate is a big dark malt sweetness, balanced by the blend of spicy Mittelfruh and citrussy Galena. Cocoa powder, rich dark chocolate, and ripe berries interplay with a toasty burnt sugar bitterness. The mouthfeel is thick and chewy with a treacly quality that doesn’t cloy, as it plays off against the hops and roast malt bitterness.","abv":8.4,"ibu":50,"og":1080,"fg":1015,"ebc":200,"ph":4.4,"att":81.3,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":14,"twist":"Try ageing on oak chips, infusing with rum raisins, or vanilla pods","malts":[["Extra Pale",6.35],["Crystal 150",0.48],["Carafa Special Malt Type 1",0.48],["Chocolate",0.48],["Munich",1.92],["Smoked Warminster",0.48]],"hops":[["Hallertauer Mittelfrüh",7.5,"grams","start","bitter"],["Hallertauer Mittelfrüh",11.5,"grams","middle","flavour"],["Galena",19,"grams","middle","flavour"]],"yeast":"Wyeast 2007 - Pilsen Lager™","food":["Smoked bratwurst and mustard","Chargrilled steak","Grilled pineapple"],"tips":"A good Porter is dependant on a long fermentation and cellaring process. Keep the temperature controlled as much as possible."},{"n":115,"name":"Melon And Cucumber IPA - B-Sides","tagline":"Fresh Melon IPA.","first":"03/2015","desc":"A Pilot Brew with 200Kg of fresh melon and 5Kg fresh cucumber added after fermentation to produce the perfect summer refreshment.","abv":6,"ibu":50,"og":1050,"fg":1010,"ebc":8,"ph":5.2,"att":87,"batchL":20,"boilL":25,"mash":[[60,10],[65,30],[72,10],[78,5]],"ferm":20,"twist":"Melon: 500g, Cucumber: 20g","malts":[["Extra Pale",4.38],["Caramalt",0.63]],"hops":[["Ahtanum",7.5,"grams","start","bitter"],["Chinook",5,"grams","middle","flavour"],["Ahtanum",7.5,"grams","middle","flavour"],["Chinook",5,"grams","end","flavour"],["Ahtanum",7.5,"grams","end","flavour"],["Simcoe",12.5,"grams","end","flavour"],["Nelson Sauvin",6,"grams","end","flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Beef carpaccio","Chilled beetroot soup","Korean watermelon salad"],"tips":"Have a good food proccesser to blend up all the melon and cucumber, also sieve out the seeds from the melon."},{"n":116,"name":"Morag's Mojito - B-Sides","tagline":"Cocktail Meets Beer.","first":"08/2015","desc":"A cunning cocktail blend of grapefruit hops, ginger spice and refreshing mint.","abv":6.7,"ibu":40,"og":1063,"fg":1010,"ebc":15,"ph":5.2,"att":84,"batchL":20,"boilL":25,"mash":[[60,10],[65,30],[72,10],[78,5]],"ferm":19,"twist":"Fresh mint leaves after fermentation, Grains of Paradise: 6.5g at end, Fresh Limes: 50g at end.","malts":[["Extra Pale",5.63],["Ginger Root",0.13]],"hops":[["Citra",12.5,"grams","start","bitter"],["Citra",12.5,"grams","middle","flavour"],["Citra",25,"grams","end","flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Tamale","Salt cod croquettes","Mint cheesecake"],"tips":"Use more freshly grated ginger in the mash to get a real spicy nature to the beer."},{"n":117,"name":"Hop Rocker","tagline":"Hoppy Aggressive Lager","first":"04/2007","desc":"The first of our foray into lager beer, Hop Rocker is a high impact, hoppy behemoth made with 100% malt. Since 2007 we have been obsessive about quality, using only the best ingredients to ensure the flavour and craftsmanship of the beer in your glass. Hop Rocker is testament to that. The malt base gives this beer a sweet, balanced complexity while the combination of New Zealand and German hops merges new world tropical juiciness with old world peppery spice.","abv":5.5,"ibu":40,"og":1052,"fg":1010,"ebc":25,"ph":4.2,"att":80.7,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":10,"twist":null,"malts":[["Maris Otter Extra Pale",3.78],["Caramalt",0.31],["Munich",0.31]],"hops":[["Cascade",12.5,"grams","start","bitter"],["Saaz",12.5,"grams","start","bitter"],["Cascade",25,"grams","end","flavour"],["Motueka",12.5,"grams","end","flavour"],["Chinook",25,"grams","end","flavour"]],"yeast":"Saflager S189","food":["Cajun spiced chicken wings","Mild cheddar","Lemon tart"],"tips":"After the fermentation has finished, chill the beer to below 5°C (if you can), wait 10 days and then rack the beer off the yeast into another bucket. The yeast left in suspension will carry on working its magic to create really clean, crisp lager flavours."},{"n":118,"name":"Bounty Hunter - Shareholder Brew","tagline":"Beatnik Milk Stout.","first":"02/2015","desc":"Brewed with our Equity Punks this rich, smooth stout is brewed with a blend of six malts, resulting in a welcoming, resonant black beer. From start to finish it carries an intense roastiness reminiscent of dark chocolate intertwined with a delicate hint of coconut and caramel.","abv":6.5,"ibu":35,"og":1068,"fg":1020,"ebc":250,"ph":4.2,"att":70.6,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":"Cacao Nibs: 25g at end, Coconut Chips: 20g at end, Lactose (wk): 375g at end, Coconut Chips: 50g at FV","malts":[["Pale Ale",2.13],["Amber",0.25],["Flaked Oats",0.25],["Chocolate",0.38],["Roasted Barley",0.13],["Carafa Special Malt Type 3",0.19]],"hops":[["Galena",12.5,"grams","start","bitter"]],"yeast":"Wyeast 1056 - American Ale™","food":["Coconut beef red curry","Butternut squash soup with toasted almonds","Chocolate coated macaroons"],"tips":"Lightly toast the coconut chips to allow better interaction with the hot wort."},{"n":119,"name":"Zeitgeist","tagline":"Organic Black Lager.","first":"12/2008","desc":"Zeitgeist is an idiosyncratic alternative black lager. Its inspiration is found more than 200 years ago. Zeitgeist takes an age old classic, a forgotten masterpiece, and gives it relevance and an avant-garde edge.","abv":4.9,"ibu":32,"og":1047.5,"fg":1010,"ebc":120,"ph":4.3,"att":79,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":15,"twist":null,"malts":[["Organic Lager",1.13],["Organic Caramalt",0.28],["Organic Munich",2.7],["Organic Chocolate",0.23]],"hops":[["Cascade",27.2,"grams","start","bitter"],["Cascade",27.2,"grams","end","flavour"]],"yeast":"Saflager S189","food":["Spicy cajun fried chicken","Pork dumplings with rich soy sauce","Cinnamon carrot cake with creamy cheese frosting"],"tips":"Inspect the colour of the wort during boiling. If it is not quite dark enough, extend the boil by 10 - 15 mins and check again. The wort will darken during the boiling process."},{"n":120,"name":"AB:10","tagline":"Imperial Brown Ale Aged In Spanish Red Wine Barrels.","first":"10/2011","desc":"A decadent, robust and encapsulating Imperial Ale. A rollercoaster of devilish berries, smooth vanilla, toasted marshmallow and wine gums; caramel malt balanced with moderate bitterness and a roasty edge.","abv":11.5,"ibu":80,"og":1096,"fg":1020,"ebc":115,"ph":4.4,"att":79.2,"batchL":20,"boilL":25,"mash":[[69,45]],"ferm":20,"twist":"Age in red wine barrels","malts":[["Extra Pale - Spring Blend",8.75],["Caramalt",0.94],["Dark Crystal",0.44],["Carafa Special Malt Type 1",0.11],["Chocolate",0.11],["Brown",0.37],["Flaked Oats",0.94]],"hops":[["Galena",37.5,"grams","start","bitter"],["Willamette",50,"grams","end","flavour"],["First Gold",25,"grams","end","flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Calves' liver with onion relish","Coq au vin","S'mores"],"tips":"Be careful of sticking the run-off. There are a lot of specialty malts in this mash that can prove problematic if pulled onto the run-off plates."},{"n":121,"name":"Punk Monk","tagline":"Who Ordered The Belgian Yeast?","first":"07/2009","desc":"Old world meets new in this trans-atlantic mash up of brewing ingredients. Belgian funk incorporates itself into the pithy, resin and grapefruit, with pineapple and banana rounding out a rambunctious avalanche of fruity hops.","abv":6,"ibu":60,"og":1056,"fg":1010,"ebc":17,"ph":4.4,"att":82.1,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Extra Pale",5.3]],"hops":[["Ahtanum",17.5,"grams","start","bitter"],["Chinook",15,"grams","start","bitter"],["Crystal",17.5,"grams","middle","flavour"],["Chinook",17.5,"grams","middle","flavour"],["Ahtanum",17.5,"grams","end","flavour"],["Chinook",17.5,"grams","end","flavour"],["Motueka",17.5,"grams","end","flavour"],["Chinook",30,"grams","dry hop","aroma"]],"yeast":"Wyeast 3522 - Belgian Ardennes™","food":["Moules frites","Thai green curry","Lemon posset"],"tips":"Bottle condition and prime with a little bit more sugar than usual to attain those authentic fine Belgian bubbles."},{"n":122,"name":"Dog Fight (w/ Flying Dog)","tagline":"Rye IPA - Flying Dog Collab.","first":"10/2012","desc":"A clash of kings. A spiced toffee malt backbone arranged against a tidal wave of US hops. Citrus, nectarine and juicy tropical fruits are layered into this complex beer.","abv":8.5,"ibu":65,"og":1078,"fg":1012,"ebc":31.2,"ph":4.4,"att":84.6,"batchL":20,"boilL":25,"mash":[[65,50]],"ferm":18,"twist":null,"malts":[["Extra Pale - Spring Blend",6.79],["Caramalt",0.25],["Rye",1.25]],"hops":[["Chinook",50,"grams","start","bitter"],["Amarillo",62.5,"grams","middle","flavour"],["Chinook",62.5,"grams","end","flavour"],["Amarillo",107.14,"grams","dry hop","aroma"],["Chinook",142.86,"grams","dry hop","aroma"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Black bean and avocado enchiladas with mole sauce","Mexican spiced cheddar cheese","Pancakes with maple syrup"],"tips":"Space the rye and caramalt out evenly in the mash. If it is all collected in one section, it can contribute to a sticky run-off."},{"n":123,"name":"Candy Kaiser","tagline":"NorDdeutsches Retro Altbier.","first":"08/2015","desc":"In this northern German style retro altbier, we’ve dialled down the dry-hops to zero, but cranked up the malt to create massive aromas. Toasty, toffee and floral notes duke it out for supremacy in the headspace of your glass. When this all hits your palate, the steely bitterness combines with the rich dry malt and the subtle alcohol warmth in a full throttle attack on your taste buds.","abv":5.2,"ibu":45,"og":1049,"fg":1009,"ebc":45,"ph":4.2,"att":81.6,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":14,"twist":null,"malts":[["Pale Ale",3.94],["Munich",0.44],["Carafa Special Malt Type 1",0.13]],"hops":[["Magnum",25,"grams","start","bitter"],["Hersbrucker",25,"grams","end","flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Aged gouda","German bratwurst sausage","Poached pear fritters"],"tips":"Make sure that the boil is vigorous enough to roll. This means that high flavours are active, and undesirable compounds like DMS are not left in the beer."},{"n":124,"name":"Chaos Theory","tagline":"Predictably Random IPA.","first":"10/2008","desc":"Chaos Theory is the most under- rated achievement of 20th Century science. This beer can only aspire to parallel to the mathematical use of the word chaos, which is at odds to the common parlance. The purest showcase of the magnificent hop that is Nelson Sauvin; grapefruit, pineapple and caramel sing above the chaos of life.","abv":7.1,"ibu":90,"og":1067,"fg":1013,"ebc":15,"ph":4.4,"att":80.6,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Pale Ale",5],["Caramalt",0.63],["Crystal 150",0.25]],"hops":[["Nelson Sauvin",12.5,"grams","start","bitter"],["Nelson Sauvin",12.5,"grams","start","bitter"],["Nelson Sauvin",12.5,"grams","middle","flavour"],["Nelson Sauvin",50,"grams","end","flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Spicy mexican meatball stew","Habenero and mango pulled pork tacos","Spiced pumpkin pie with chocolate whipped cream"],"tips":"Get to know the guys in your local homebrew shop. They can give you a heads up when rare brewing materials – like Nelson Sauvin – are coming in."},{"n":125,"name":"Juniper Wheat Beer","tagline":"American Style Wheat Ale With Juniper Berries.","first":"06/2011","desc":"A variant on the 2008 release of Bad Pixie, but hoppier. Substituting the lemon peel for Ahtanum provided a vibrant floral and lemon citrus hit, balancing the slight tartness from the wheat. This dry, effervescent brew is perfect on Scotland's one day of summer.","abv":5,"ibu":40,"og":1047,"fg":1008,"ebc":15,"ph":4.1,"att":83,"batchL":20,"boilL":25,"mash":[[64,75]],"ferm":17,"twist":null,"malts":[["Pale Ale",2.75],["Wheat",2.13]],"hops":[["Ahtanum",31.25,"grams","start","bitter"],["Ahtanum",31.25,"grams","end","flavour"],["Juniper Berries",25,"grams","dry hop","aroma"]],"yeast":"Wyeast 1010 - American Wheat™","food":["Herring rollmops","Chicken schnitzel","Gin & elderflower jelly"],"tips":"Give the juniper berries a quick blast in a food processor to break them up - otherwise they can jam up your fermenter."},{"n":126,"name":"Jet Black Heart","tagline":"Oatmeal Milk Stout. Dark. Roasty. Velvety.","first":"01/2016","desc":"Good things come to those who wait. This smooth and roasty oatmeal milk stout won our 2015 Prototype Challenge at a canter. Roasty coffee and chocolate lead to a decadent, full-bodied richness of near uncharted depths with a velvet mouthfeel from the addition of oatmeal and a touch of wheat. This is complemented at every turn by the Magnum and Sorachi Ace hops, with the latter bringing an intensity of smooth vanilla and dark berry fruit on the long, rewarding finish.","abv":4.7,"ibu":45,"og":1055,"fg":1019,"ebc":200,"ph":4.4,"att":70,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Pale Ale",2.75],["Wheat",0.25],["Dark Crystal",0.19],["Brown",0.38],["Black Malt",0.19],["Carafa Special Malt Type 1",0.19],["Flaked Oats",0.38],["Crystal 150",0.25],["Lactose",0.38]],"hops":[["Magnum",12.5,"grams","start","bitter"],["Sorachi Ace",6.3,"grams","middle","flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Oyster beignets","Beef shin stew","A Shakin' jesse"],"tips":"There's a lot of speciality malt in the mash. Make sure you take the run off nice and steady – increase the flow too much and pull in the bed at your peril."},{"n":127,"name":"Galaxy","tagline":"Single Hop India Pale Ale – 2012.","first":"02/2012","desc":"With all the rich tropical flavour you'd expect from Australia's Galaxy, this beer backs up a strong citrus aroma and flavour with a mellow undercurrent of passion fruit and mango. Zingy and sweet but not too sweet, Galaxy has a soft and inviting fruity hop character.","abv":6.7,"ibu":67,"og":1013,"fg":1064,"ebc":19,"ph":4.4,"att":79.7,"batchL":20,"boilL":25,"mash":[[68,null]],"ferm":19,"twist":null,"malts":[["Extra Pale - Spring Blend",5.87],["Caramalt",0.37],["Crystal 150",0.19]],"hops":[["Galaxy",75.4,"grams","start","bitter"],["Galaxy",75.4,"grams","end","flavour"],["Galaxy",250,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Spicy green chilli and lemongrass chicken thai curry","Sharp cheddar cheese and crackers","Ginger and orange zest cookies"],"tips":"Use fresh Galaxy for the best flavour profile."},{"n":128,"name":"White Noise","tagline":"White IPA with Motueka.","first":"07/2012","desc":"A White IPA; brewed with plenty of wheat, fermented with a Belgian yeast with some coriander thrown in for good measure. Oh and this one has mountains of Motueka hops. And then lots of dry hops too.","abv":6.8,"ibu":50,"og":1060,"fg":1012,"ebc":30,"ph":4.4,"att":80,"batchL":20,"boilL":25,"mash":[[67,30]],"ferm":18,"twist":"Coriander powder: 37.5g at end","malts":[["Extra Pale - Spring Blend",2.81],["Wheat",2.81],["Munich",0.94],["Flaked Oats",0.31]],"hops":[["Motueka",50,"grams","start","bitter"],["Motueka",31.25,"grams","end","flavour"],["Motueka",250,"grams","dry hop","aroma"]],"yeast":"Wyeast 3944 - Belgian Witbier™","food":["Huevos rancheros","Mild coriander and chilli chicken curry","Panna cotta with an orange and raspberry sauce"],"tips":"Coriander seed or powder can be added to either the boil, or after the fermentation has finished. They will both impact different characteristics to the beer."},{"n":129,"name":"Hinterland","tagline":"A Most Beguiling Brew.","first":"05/2015","desc":"Hinterland is a beer long in the creation, and even longer in the appreciation. On the aroma, deep reverberating roasty bitterness and sweet dark chocolate. Also in evidence, woodsmoke, rich vanilla, mocha and marzipan. When tasting, Hinterland reveals itself as the beer moves from cellar temperature to something warmer, yielding all of the above plus dried fruit, rich ganache and ending on a resoundingly warming finish redolent of chocolate liqueur or plum brandy.","abv":9,"ibu":85,"og":1094,"fg":1025,"ebc":400,"ph":4.3,"att":73.4,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":21,"twist":"Lactose (Milk Sugar): 500g at middle","malts":[["Pale Ale",6.88],["Wheat",0.5],["Flaked Oats",1],["Dark Crystal",0.5],["Carafa Special Malt Type 1",0.75],["Chocolate",1]],"hops":[["Bramling Cross",12.5,"grams","start","bitter"],["Bramling Cross",12.5,"grams","middle","flavour"],["Sorachi Ace",12.5,"grams","middle","flavour"],["Sorachi Ace",25,"grams","end","flavour"],["Willamette",25,"grams","end","flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Mulled cheddar buffalo burger","Venison with warm spices (cardamom) and sweet potato","Pure vanilla bean ice cream"],"tips":"Towards the end of the fermentation allow the temperature to free rise. This will let the yeast finish off the fermentation and scour off-flavours from the beer."},{"n":130,"name":"Spiced Cherry Sour - B-Sides","tagline":"Alternative Festive.","first":"03/2015","desc":"Think bakewell tart with Christmas spices.","abv":6.5,"ibu":20,"og":1060,"fg":1010,"ebc":null,"ph":3.2,"att":87,"batchL":20,"boilL":25,"mash":[[60,10],[65,30],[72,10],[78,5]],"ferm":20,"twist":null,"malts":[["Extra Pale",3.75],["Wheat Malt",0.63],["Rye",1.25],["Acidulated Malt",0.63],["Dark Crystal",0.63],["Special W",0.63],["Munich",0.63]],"hops":[["Citra",3.5,"grams","start","bitter"],["Sorachi Ace",1.5,"grams","start","bitter"]],"yeast":"Wyeast 1056 - American Ale™","food":["Wild rice salad with wild mushrooms","Apple gingerbread pancakes","Christmas Pudding"],"tips":"In the boil: cinnamon, star anise, clove, guinea pepper. After fermentation add: raspberry puree, cherry concentrate, bitter almond extract, American oak chips and Tahitian vanilla beans."},{"n":131,"name":"Motueka","tagline":"Single Hop India Pale Ale – 2012.","first":"02/2012","desc":"Lemon and lime rise to the top of this hoppy brew, with supporting acts of tropical fruit for a very rounded, thoroughly satisfying flavour. Motueka is a hop we've used in loads of recipes; it has enough resin to balance the intense fruity character.","abv":6.7,"ibu":67,"og":1013,"fg":1064,"ebc":19,"ph":4.4,"att":79.7,"batchL":20,"boilL":25,"mash":[[68,null]],"ferm":19,"twist":null,"malts":[["Extra Pale - Spring Blend",5.87],["Caramalt",0.37],["Crystal 150",0.19]],"hops":[["Motueka",75,"grams","start","bitter"],["Motueka",100,"grams","end","flavour"],["Motueka",250,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Tofu pad Thai with fresh lime juice and coriander","Fish tacos with avocado","Key lime pie"],"tips":"Be careful with the Motueka additions. It has an intense citrus character that is often tempered by using in conjunction with other hops."},{"n":132,"name":"5am Saint","tagline":"Bittersweet Chaos. Malty. Fruity. Bite.","first":"06/2009","desc":"Out of order and stability comes the rush of the pack. Berry and caramel riding alongside marmalade and chocolate. Spice and toast jostle with lychee and biscuit. The needle flicks to all points of the compass. It drives you towards the horizon, towards the vanishing point. And it keeps going...","abv":5,"ibu":30,"og":1050,"fg":1012,"ebc":60,"ph":4.4,"att":76,"batchL":20,"boilL":25,"mash":[[62,75]],"ferm":19,"twist":null,"malts":[["Extra Pale",2.56],["Caramalt",0.88],["Munich",0.63],["Crystal 150",0.38],["Dark Crystal",0.13]],"hops":[["Cascade",2.5,"grams","start","bitter"],["Amarillo",2.5,"grams","start","bitter"],["Nelson Sauvin",2.5,"grams","middle","flavour"],["Amarillo",12.5,"grams","end","flavour"],["Nelson Sauvin",12.5,"grams","end","flavour"],["Simcoe",25,"grams","dry hop","aroma"],["Cascade",50,"grams","dry hop","aroma"],["Ahtanum",25,"grams","dry hop","aroma"],["Nelson Sauvin",12.5,"grams","dry hop","aroma"],["Centennial",50,"grams","dry hop","aroma"],["Amarillo",25,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Cheddar cheese melt on crisp rye toast","Moroccan chicken tangine","Cheesecake topped with kiwi"],"tips":"Go easy on the crystal and dark crystal malt. Too much will skew the flavour profile away from lychees and citrus towards dried fruit."},{"n":133,"name":"Black Eye Joe (w/ Stone Brewing Co)","tagline":"Coffe Black IPA.","first":"11/2013","desc":"A fresh tropical hit from this Black IPA, with undertones of roasted coffee. A well balanced, drinkable yet complex beer.","abv":5.8,"ibu":40,"og":1053,"fg":1008,"ebc":177.3,"ph":4.4,"att":84.9,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":"Fresh coffee in the boil.","malts":[["Extra Pale",2.7],["Caramalt",0.7],["Munich",0.64],["Chocolate",0.06]],"hops":[["Simcoe",25,"grams","start","bitter"],["Amarillo",25,"grams","start","bitter"],["Coffee",12.5,"grams","middle","flavour"],["Amarillo",37.5,"grams","end","flavour"],["Simcoe",37.5,"grams","end","flavour"],["Coffee",12.5,"grams","end","flavour"],["Simcoe",125,"grams","dry hop","aroma"],["Amarillo",125,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Spicy carne asada with black beans and Mexican Rice","Pork smothered in mole sauce","Chocolate covered espresso beans"],"tips":"Be careful to select the right coffee for this brew. For a fresh but fruity coffee hit, try to find lightly roasted Arabica beans."},{"n":134,"name":"Mr.Miyagi's Wasabi Stout","tagline":"Spicy Stout Brewed By Aberdeen Bar Staff.","first":"09/2011","desc":"Invented by and brewed by Dan Bloxham, no matter what anyone else says. A medium bodied, bitter, US style stout, with a wasabi warmth, a subtle earthiness and a hint of soy sauce.","abv":7.5,"ibu":90,"og":1072,"fg":1015,"ebc":200,"ph":4.4,"att":79.2,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":21,"twist":"Wasabi Powder: 45g at end, Wasabi Paste: 75g at end","malts":[["Maris Otter Extra Pale",6],["Chocolate",0.5],["Flaked Oats",0.5],["Crystal",0.5],["Black Malt",0.25],["Roasted Malt",0.25]],"hops":[["Chinook",81.25,"grams","start","bitter"],["Sorachi Ace",62.5,"grams","end","flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["California sushi rolls with fresh crab and wasabi infused soy sauce","Spicy chilli and coriander Thai beef stew","Carrot and coriander rich cake"],"tips":"During mashing in use only pale malts, add flaked oats during the second half of the mashing process. If you can't get real wasabi, substitute for some horseradish to get the peppery heat in the beer."},{"n":135,"name":"Growler","tagline":"Citra Hopped Pilsner","first":"03/2011","desc":"Brewed by Pivovar Group at BrewDog, specifically for thier bars, Pivo in Leeds, Sheffield Tap in Sheffield, and Euston Tap in Euston. It was then lagered for 2 months and dry hopped with citra.","abv":4.5,"ibu":38,"og":1042.9,"fg":1008,"ebc":18,"ph":4.4,"att":81,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":10,"twist":null,"malts":[["Pale Ale",4],["Caramalt",0.25],["Crystal 150",0.13]],"hops":[["Citra",8.5,"grams","start","bitter"],["Citra",62.5,"grams","end","flavour"],["Citra",31.5,"grams","dry hop","aroma"]],"yeast":"Wyeast 2007 - Pilsen Lager™","food":["Havarti cheese","Cajun spiced fried chicken","Lemon squares"],"tips":"Dry hop three days before you intend to package to get the freshest hop flavour possible."},{"n":136,"name":"#Mashtag 2014","tagline":"Democratic Imperial Red Ale.","first":"05/2014","desc":"A slightly psychotic, orange-that- thinks-it’s-a-grapefruit character builds upon and intensifies the hop bitterness, squaring up against the rich sweet malt base. The result is a huge Red Ale with a drinkable quality you’d expect in a beer half this strength.","abv":9,"ibu":50,"og":1084,"fg":1015,"ebc":20,"ph":4.4,"att":82.1,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":21,"twist":"Blood Orange: 250g at end, Lemon Peel: 3.9g at end, Orange Peel: 7.7g at end","malts":[["Extra Pale",7.5],["Caramalt",0.38],["Crystal 150",0.58],["Chocolate",0.1]],"hops":[["Motueka",9.5,"grams","start","bitter"],["Hallertauer Mittelfrüh",19,"grams","start","bitter"],["Amarillo",19,"grams","middle","flavour"],["Motueka",19,"grams","middle","flavour"],["Amarillo",19,"grams","end","flavour"],["Motueka",28.5,"grams","end","flavour"],["Amarillo",57.5,"grams","dry hop","aroma"],["Centennial",57.5,"grams","dry hop","aroma"],["Simcoe",57.5,"grams","dry hop","aroma"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Beetroot and blood orange salad","Coriander and mango grilled steak tacos","Orange sherbet ice cream"],"tips":"Experiment with different citrus juices to get a wide array of flavours and aromas in the beer."},{"n":137,"name":"Sink The Bismarck!","tagline":"IPA For The Dedicated.","first":"12/2009","desc":"This is IPA amplified, the most evocative style of the craft beer resistance with the volume cranked off the scale. Kettle hopped, dry hopped then freeze hopped for a deep fruit, resinous and spicy aroma. A full on attack on your taste buds ensues as the incredibly smooth liquid delivers a crescendo of malt, sweet honey, hop oils and a torpedo of hop bitterness that lasts and lasts ",25,"grams","middle","flavour"],["Coffee beans",12.5,"grams","middle","flavour"],["Fuggles",25,"grams","end","flavour"],["Coffee beans",12.5,"grams","end","twist"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Blackened cajun beef","Cave-aged cheddar","Flourless chocolate chilli cake"],"tips":"Be really careful when mashing, as this amount of malt can get tough to sparge! Add honey into the boil, and naga chili and vanilla in maturation (soak them in some neutral spirit to sanitise)"},{"n":139,"name":"Born To Die","tagline":"Terminally Hoppy India Pale Ale.","first":"03/2015","desc":"Savagely bitter, exceptionally dry, this IPA is born to die on a predetermined day. It proudly displays its short-lived life span front and centre. There is no better time to drink this than the moment you get your paws on it. Awesome bitterness backed up by unrelenting aromas of resin, citrus, and juicy fruit. Born To Die is a eulogy to the hops that sacrificed themselves in its creation. An incredibly ambitious and satisfying small batch brew.","abv":8.5,"ibu":85,"og":1072,"fg":1007,"ebc":15,"ph":4.4,"att":90.3,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":18,"twist":null,"malts":[["Pale Ale",5.5],["Maris Otter Extra Pale",1]],"hops":[["C02 Extract",25,"grams","start","bitter"],["Amarillo",12.5,"grams","middle","flavour"],["Simcoe",12.5,"grams","middle","flavour"],["Mosaic",25,"grams","end","flavour"],["Citra",25,"grams","end","flavour"],["Amarillo",25,"grams","end","flavour"],["Simcoe",25,"grams","end","flavour"],["Citra",62.5,"grams","dry hop","aroma"],["Amarillo",62.5,"grams","dry hop","aroma"],["Simcoe",62.5,"grams","dry hop","aroma"],["Mosaic",62.5,"grams","dry hop","aroma"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Caramelised onion and lightly seared steak","Pulled barbecue brisket","Salted caramel cheesecake"],"tips":"Fresh is best with this beer. Use fresh hops in the brew and during dry hop stages. Condition just long enough to let the powerful grassy aroma "abv":3.8,"ibu":20,"og":1039,"fg":1000,"ebc":6,"ph":5.2,"att":87,"batchL":20,"boilL":25,"mash":[[60,10],[65,30],[72,10],[78,5]],"ferm":20,"twist":"Orange blossom honey: 1kg in FV.","malts":[["Extra Pale",2.5],["Wheat Malt",1.25],["Rye",0.63]],"hops":[["Citra",5,"grams","start","bitter"],["Amarillo",5,"grams","start","bitter"],["Citra",7.5,"grams","end","flavour"],["Amarillo",7.5,"grams","end","flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Soy and honey glazed mackerel","Moroccan spice lamb shanks","Baklava"],"tips":"If possible use the orange blossom honey addition at the end of fermentation to carbonate the beer, this will keep the delicate blossom honey aroma from escaping."},{"n":143,"name":"Lizard Bride - Prototype Challenge","tagline":"Fruit Infused Sour IPA.","first":"07/2015","desc":"Wonderfully tart, bitter, piney and filled with the fruity elements from raspberries, blueberries and sour cherries. Oh, and it’s purple.","abv":5.7,"ibu":35,"og":1053,"fg":1009,"ebc":25,"ph":4.4,"att":79.3,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":17,"twist":"Blackcurrant: 65g at FV, Sour Cherry: 65g at FV, Blueberry: 65g at FV, Sea Buckthorn: 65g at FV, Cranberry: 65g at FV, Blackberry: 65g at FV, Sweet cherry: 65g at FV","malts":[["Extra Pale",4.25],["Carared",0.63]],"hops":[["Citra",2.5,"grams","start","bitter"],["Challenger",6,"grams","start","bitter"],["Centennial",12.5,"grams","middle","flavour"],["Citra",10,"grams","middle","flavour"],["Citra",12.5,"grams","end","flavour"],["Mosaic",12.5,"grams","end","flavour"],["Bramling Cross",12.5,"grams","end","flavour"],["Centennial",50,"grams","dry hop","aroma"],["Citra",50,"grams","dry hop","aroma"],["Bramling Cross",50,"grams","dry hop","aroma"],["Mosaic",50,"grams","dry hop","aroma"],["Nelson Sauvin",12.5,"grams","dry hop","aroma"],["Simcoe",12.5,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Roasted pumpkin and mozzarella","Black forrest gateaux"],"tips":"Try to find the ripest berries possible to impart as much juicy goodness as possible. These can be forzen until you have the full set."},{"n":144,"name":"Tokyo*","tagline":"Intergalactic Stout. Rich. Smoky. Fruity.","first":"06/2009","desc":"Our most involved beer, Tokyo* is an Imperial Stout brewed with copious amounts of specialty malts, jasmine and cranberries, dry-hopped with a bucket-load of our favourite hops and then carefully aged on toasted French oak chips. It’s all about moderation. Everything in moderation, including moderation itself...","abv":16.2,"ibu":85,"og":1157,"fg":1028,"ebc":250,"ph":4.4,"att":82.2,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":21,"twist":"Cranberry: 25g at end, Jasmine: 25g at end, Muscovado sugar: 300g at middle, Oak chips: 15g at FV","malts":[["Extra Pale",11.25],["Dark Crystal",1.75],["Chocolate",0.5],["Roasted Barley",0.5]],"hops":[["Chinook",37.5,"grams","start","bitter"],["Galena",37.5,"grams","start","bitter"],["Chinook",37.5,"grams","start","bitter"],["Galena",37.5,"grams","start","bitter"],["Galena",25,"grams","end","flavour"],["First Gold",25,"grams","end","flavour"],["Chinook",25,"grams","end","flavour"]],"yeast":"WLP099 - Super High Gravity Ale","food":["Herbal roast beef with a cranberry jus","Baked honey glazed ham with dark fruit sauce","Dark fruit cake"],"tips":"If in doubt, just split the malt bill in two and do a double mash. Mash and collect, clean out and mash and collect again. Don’t even bother sparging – you don’t want any more water in there. Keep the fermentation a little warmer than usual 21 - 23°C, and don’t panic if it takes a month to ferment..."},{"n":145,"name":"Sorachi Bitter - B-Sides","tagline":"Sorachi Ace Bitter.","first":"03/2015","desc":"Pilot Brew: A twist on an English Bitter style beer, using Sorachi Ace hops throughout making a showcase of the off the dill and lemon character.","abv":6.3,"ibu":130,"og":1060,"fg":1010,"ebc":14,"ph":5.2,"att":83,"batchL":20,"boilL":25,"mash":[[60,10],[65,30],[72,10],[78,5]],"ferm":20,"twist":"This beer was unfiltered to give it a traditional ale appearance, Indian Coriander: 2.5g at end","malts":[["Extra Pale",4.38],["Crystal 150",0.16],["Dark Crystal",0.16],["Munich",1.25],["Rye",0.63]],"hops":[["Galena",17.5,"grams","start","bitter"],["Sorachi Ace",17.5,"grams","start","bitter"],["Ella",17.5,"grams","start","bitter"],["Galena",17.5,"grams","middle","flavour"],["Sorachi Ace",17.5,"grams","middle","flavour"],["Ella",17.5,"grams","middle","flavour"],["Galena",17.5,"grams","end","flavour"],["Sorachi Ace",17.5,"grams","end","flavour"],["Ella",17.5,"grams","end","flavour"],["Galena",10,"grams","dry hop","aroma"],["Sorachi Ace",10,"grams","dry hop","aroma"],["Ella",10,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Greek piroshki pies","Poached salmon with salsa verde","Strawberry filo tarts"],"tips":"The touch of rye adds a great touch of spice that plays off the hops really well."},{"n":146,"name":"Nelson Sauvin","tagline":"Single Hop IPA Series – 2011.","first":"01/2011","desc":"Nelson is a love it or hate it kinda hop. We are cool with that, if we wanted to keep everyone happy we would be brewing Fosters anyway. Sharp as a razor, this New Zealand hop slices its way through your taste buds and is brutally resinous, almost scraping the intense flavours of passion fruit along your poor tongue. There is a huge depth of tropical fruit flavour with astringent gooseberry balanced against the robust malt base. Throw another shrimp on the barbie mate and you are all set. New Zealand is near Austria, right?","abv":7.5,"ibu":75,"og":1068,"fg":1013,"ebc":30,"ph":4.4,"att":82.1,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":19,"twist":null,"malts":[["Extra Pale",6.38],["Crystal 150",0.13],["Caramalt",0.25]],"hops":[["Nelson Sauvin",37.5,"grams","start","bitter"],["Nelson Sauvin",50,"grams","end","flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Grilled halloumi salad with orange and pomegranate vinaigrette","Baked Camembert with smoked garlic, and salt and pepper wheat crackers","Crab cakes with lemon cream and herb dipping sauce"],"tips":"Nelson is an amazing hop in the correct proportions. Too much and the beer will start to taste like onions and garlic."},{"n":147,"name":"Hello My Name Is Little Ingrid","tagline":"Cloudberry Session IPA.","first":"03/2015","desc":"This beer hits all the high-points of Hello My Name is Ingrid – with one important exception. Brewed at 4.4% abv, Little Ingrid is a session- strength version of our cloudberry- infused celebration of all that is epic about Sweden. The zesty balance of citrus from the four different hops is just as pronounced as in the original.","abv":4.4,"ibu":35,"og":1045,"fg":1012,"ebc":30,"ph":4.4,"att":73.3,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":"Cloudberries: 27.5g at end","malts":[["Extra Pale",3.69],["Caramalt",0.5]],"hops":[["Columbus",25,"grams","start","bitter"],["Centennial",25,"grams","start","bitter"],["Columbus",25,"grams","middle","flavour"],["Centennial",25,"grams","middle","flavour"],["Nelson Sauvin",75,"grams","middle","flavour"],["Bramling Cross",75,"grams","middle","flavour"],["Columbus",75,"grams","end","flavour"],["Centennial",75,"grams","end","flavour"],["Nelson Sauvin",75,"grams","end","flavour"],["Bramling Cross",75,"grams","end","flavour"],["Nelson Sauvin",70,"grams","dry hop","aroma"],["Bramling Cross",70,"grams","dry hop","aroma"],["Simcoe",70,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Scones with cloudberry jam","Oysters with a chilli and dill sauce","Rhubarb tart"],"tips":"Sourcing fresh cloudberries might involve a trip to Sweden but boy are they worth it."},{"n":148,"name":"AB:02","tagline":"Triple Dry Hopped Imperial Red Ale.","first":"05/2010","desc":"The second installation in the Abstrakt Concept beer line up. All the benefits of a malty biscuited red ale, layered with tons of hops. We recommend ageing this beer for 6 months. Try one now, and 2007 - Pilsen Lager™","food":["Mexican ceviche","Blue cheese crumbled over wedges","Gooey lemon bar"],"tips":"The most important thing about making a lager? Fermentation temperature! Do everything you can to control the ambient temperature to 9 - 12°C. In the old days, they used to brew lager over winter, so the colder temperature gave a much preferable fermentation profile. Ferment too hot and you beer will taste like yeasty bread."},{"n":164,"name":"Ella - IPA Is Dead","tagline":"Single Hop India Pale Ale.","first":"03/2015","desc":"2015 IPA is Dead Series. Supremely floral, this hugely under-rated hop is related to Galaxy and was first cultivated in the Australian state of Victoria. Initially given the same name as a certain Eurolager, their lawyers got involved and the St- prefix was dropped. Ella displays subtle notes of spice, but is fundamentally a truly floral bouquet, redolent of the Southern Hemisphere.","abv":7.2,"ibu":100,"og":1064,"fg":1010,"ebc":12,"ph":4.4,"att":84,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Extra Pale",6.39]],"hops":[["Ella",2.5,"grams","start","bitter"],["Ella",41.5,"grams","middle","flavour"],["Ella",41.5,"grams","end","flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Cheddar cheese toastie on dark rye","Lamb samosas with chilli dipping sauce","Cheesecake"],"tips":"These beers need to hit FG to really pop. If you're fermentation is struggling, whip up a starter and re-pitch to get some viable yeast in there to finish the job"},{"n":165,"name":"Barley Wine - Russian Doll","tagline":"Double India Pale Ale.","first":"06/2014","desc":"Russian Doll was an experimental set of brews showcasing the effects of varying the amount and ratio of malts in the grist. The barley wine had rich, chewy dark fruit aromas balanced with a spike of zesty hops. Toffee, apricot jam and grapefruit pith, crammed into the head of our little Russian Doll family.","abv":10,"ibu":80,"og":1097,"fg":1020,"ebc":65,"ph":4.4,"at ith the insatiable hopload of an IPA. Rich spiced blackcurrant and caramel up front, with a sharp bitter finish following behind, bringing grapefruit and resin with it. Dry, bitter and intense; this is an IPA first and foremost, given a dark malt makeover. Originally brewed as a Simcoe only single hop IPA, we've experimented with adding a little Cascade and Mosaic for extra depth.","abv":7.2,"ibu":50,"og":1068,"fg":1013,"ebc":150,"ph":4.4,"att":78.6,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Extra Pale",5.3],["Caramalt",0.25],["Crystal 150",0.19],["Carafa Special Malt Type 1",0.13],["Carafa Special Malt Type 3",0.19]],"hops":[["Simcoe",18.75,"grams","start","bitter"],["Simcoe",18.75,"grams","middle","bitter"],["Simcoe",37.5,"grams","end","flavour"],["Simcoe",175,"grams","dry hop","aroma"],["Cascade",37.5,"grams","dry hop","aroma"],["Mosaic",37.5,"grams","dry hop","aroma"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Grilled king prawns with a chilli lime sauce","Blue cheese burger","Flourless chocolate ginger cake"],"tips":"The goal here is to make a black beer that tastes like an IPA. Don't overload the black or roasted malts to try and achieve the correct colour. Too much roasted malts will suppress far too much of that beautiful citrus and tropical flavour from the Simcoe. It may be hard to get hold of Carafa, but it will allow you to get a great colour, without all of the characteristic roasty astringent flavours."},{"n":168,"name":"Jack Hammer","tagline":"Ruthless India Pale Ale. Hoppy. Bitter. Hoppy.","first":"06/2012","desc":"Hopped beyond the point at which IBUs are measurable, only the most hardened palate will get beyond Jack Hammer's intensely resinous pithy bitterness and to the grapefruit, orange zest and dry biscuity malt beyond. You could brew this with less hops, but really, why would you bother?","abv":7.2,"ibu":250,"og":1065,"fg":1010,"ebc":15,"ph":4.4,"att":84.6,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":21,"twist":null,"malts":[["Extra Pale",5.8]],"hops":[["Centennial",25,"grams","start","bitter"],["Columbus Extract",30,"grams","start","bitter"],["Centennial",18.75,"grams","middle","flavour"],["Columbus",18.75,"grams","middle","flavour"],["Centennial",50,"grams","end","flavour"],["Columbus",25,"grams","end","flavour"],["Amarillo",100,"grams","dry hop","aroma"],["Citra",100,"grams","dry hop","aroma"],["Simcoe",100,"grams","dry hop","aroma"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Phall Curry","Pork burrito with a habanero and mango chilli salsa","Ginger and grapefruit poundcake"],"tips":"Be aware that this is probably the hoppiest beer you will ever make. Make sure you use fresh hops, for a massive fresh grapefruit hit. Have everything else in your store cupboard, and buy your hops last, as close to brew day as possible!"},{"n":169,"name":"AB:19","tagline":"A Blend of Two Barrel-aged Imperial Saisons.","first":"06/2012","desc":"One of the most complex beers we’ve ever attempted. A blend of two barrel-aged Imperial Saisons – one black, one red – which has in turn then been aged in rum barrels, it is an enormous, intricate beer. A baseline of warm, smoky raisin and plum, followed by punchy flavour elements coming to the fore – coconut, mint and blackcurrant. There’s a long undercurrent of treacle toffee, before the finish darkens to liquorice, star anise amidst a touch of honey sweetness.","abv":13.1,"ibu":null,"og":null,"fg":null,"ebc":null,"ph":null,"att":null,"batchL":20,"boilL":25,"mash":[],"ferm":null,"twist":"This beer is an odd one in our collection as it is a blend of two recipes that feature elsewhere. These recipes are #123 Everyday Anarchy and #124 Black Jacques. Both Imperial Saisons spent a little under a year in white and red wine barrels respectively. However, while the pair were being tasted to determine their readiness to be released, a fun game of blending turned into a light bulb moment. The beers were blended and laid down once more in our barrel cellar, this time being infused with the heady note of rum. We were so excited about this mystical blend that we ended up using up all the beer that had been lovingly aged. It would have been a travesty for these beers to go unrecognised as the unique individuals they were, so we brewed them again in 2013 to be released as had always been intended. Age the individual beers separately before blending and ageing further on oak chips soaked in rum.","malts":[],"hops":[],"yeast":null,"food":["Game terrine","Spiced fruit cake","Chocolate, cherry and hazelnut mousse"],"tips":"It can be difficult to get the perfect balance between both beers. Set up several small blends of varying percentages to determine which you prefer."},{"n":170,"name":"Bashah (w/ Stone Brewing Co)","tagline":"Black Belgian Double IPA.","first":"08/2009","desc":"Brewed when our good friends from Stone visited in 2009. Black As Sin, Hoppy As Hell - no other beer name has quite hit the nail so squarely on the head. Dark roasted malt makes a beautiful canvas for the savage hop bitterness, pine needles and orange zest.","abv":9.7,"ibu":100,"og":1088,"fg":1015,"ebc":30,"ph":4.4,"att":83,"batchL":20,"boilL":25,"mash":[[65,175]],"ferm":19,"twist":null,"malts":[["Extra Pale",8.13],["Chocolate",0.16],["Carafa Special Malt Type 3",0.48]],"hops":[["Hercules",31.3,"grams","start","bitter"],["Magnum",12.5,"grams","start","bitter"],["Magnum",12.5,"grams","start","bitter"],["Hercules",12.5,"grams","end","flavour"],["Centennial",25,"grams","end","flavour"],["Amarillo",25,"grams","end","flavour"]],"yeast":"Wyeast 3522 - Belgian Ardennes™","food":["Chocolate crème brûlée with raspberries","Thyme, rosemary and black pepper rubbed roast beef served with fried green beans","Angus beef cheeseburger"],"tips":"We also produced two separate barrel- aged versions of this beer; Bashah 2009 Highland Park and Black Raspberry Reserve, and Bashah 2009 Imperial and Tayberry Reserve were two barrel aged versions of the beer. Try ageing this beer on oak or with fruit to make your own reserve."},{"n":171,"name":"Challenger","tagline":"Single Hop India Pale Ale – 2012.","first":"02/2012","desc":"Challenger is known for its herbal and fruity characteristics. When used alone in a beer like IPA is Dead, Challenger brings light woodsy notes, floral hints, and delicate green tea, alongside more recognisable citrus notes. As a dual-purpose hop, it also yields great bittering potential, which is ideal in a dry bitter IPA.","abv":6.7,"ibu":67,"og":1064,"fg":1013,"ebc":19,"ph":4.4,"att":79.7,"batchL":20,"boilL":25,"mash":[[68,null]],"ferm":19,"twist":null,"malts":[["Extra Pale - Spring Blend",5.87],["Caramalt",0.37],["Crystal 150",0.19]],"hops":[["Challenger",85,"grams","start","bitter"],["Challenger",100,"grams","end","flavour"],["Challenger",250,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Caramelized onion and steak pie","Chicken Khua Kling (dry Thai curry)","Lemon drizzle cake"],"tips":"Challenger hops come from English hops farms - try getting hold of some fresh, undried hops and make a \\"wet hop\\" beer."},{"n":172,"name":"Single Hop Enigma IPA - B-Sides","tagline":"Enigma Hopped IPA.","first":"01/2016","desc":"A cheeky play with a new hop on the pilot kit. Expect notes of redcurrant, melon and citrus. An intriguing possibility for the future.","abv":5,"ibu":50,"og":1050,"fg":1011,"ebc":10,"ph":4.4,"att":78,"batchL":20,"boilL":25,"mash":[[60,10],[65,30],[72,10],[78,5]],"ferm":19,"twist":null,"malts":[["Propino Pale Malt",4.1]],"hops":[["Enigma",2.5,"grams","start","bitter"],["Enigma",10,"grams","middle","flavour"],["Enigma",37.5,"grams","end","flavour"]],"yeast":"Wyeast 1056 - American Ale™ & Wyeast 1272 - American Ale II™","food":["Jalapeño poppers with blue cheese dip","T-bone steak with fried onions","Carrot cake with cream cheese frosting"],"tips":"Enigma has a very high alpha acid so be careful not to over do the bittering hops."},{"n":173,"name":"Chinook - IPA Is Dead","tagline":"Single Hop India Pale Ale.","first":"03/2015","desc":"2015 IPA is Dead series. Often used as a combination hop for American Pale Ales and IPAs, Chinook can really shine when left to front a beer all on its own. The main reason for this is that it’s thunderously piney, with a fistful of spice kicked up in your face as you lie on the beach. A true heavyweight of the brewing industry.","abv":7.2,"ibu":100,"og":1064,"fg":1010,"ebc":12,"ph":4.4,"att":84,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Extra Pale",6.39]],"hops":[["Chinook",13.5,"grams","start","bitter"],["Chinook",41.5,"grams","middle","flavour"],["Chinook",41.5,"grams","end","flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Chicken fajita spiced monteray jack quesadillas","Chilli lime and coriander marinated king prawn cocktail","Margarita key lime pie"],"tips":"Chinook is a hop that can really shine on its own so don't be shy and really throw it at this IPA"},{"n":174,"name":"Konnichiwa Kitsune","tagline":"Hello My Name Is Yuzu.","first":"10/2014","desc":"Named in a slight deviation from our Hello My Name Is series, Konnichiwa Kitsune is a Japanese- inspired, yuzu-infused Imperial IPA, brewed with Amarillo, Cascade and Citra. These punchy new world hops bring orange, grapefruit and lime to back up the yuzu aroma and flavour. Big mandarin notes, balanced against a caramel malt biscuity base.","abv":4.4,"ibu":70,"og":1045,"fg":1012,"ebc":30,"ph":4.4,"att":82.9,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":20,"twist":"Yuzu juice: 250g at FV","malts":[["Extra Pale",6.13],["Caramalt",0.86]],"hops":[["Amarillo",12.5,"grams","start","bitter"],["Citra",6,"grams","start","bitter"],["Cascade",12.5,"grams","start","bitter"],["Amarillo",6,"grams","middle","flavour"],["Citra",6,"grams","middle","flavour"],["Cascade",12.5,"grams","middle","flavour"],["Amarillo",18.5,"grams","end","flavoour"],["Citra",12.5,"grams","end","flavouor"],["Cascade",12.5,"grams","end","flavour"],["Citra",100,"grams","dry hop","aroma"],["Amarillo",137.5,"grams","dry hop","aroma"],["Cascade",87.5,"grams","dry hop","aroma"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Fresh seared tuna and rocket salad","Lemon meringue pie","Baked chicken with yuzu reduction"],"tips":"Squeeze the fresh yuzu juice directly into the beer after primary fermentation is complete. Putting it in the hot wort may seem like better practice, but the juice will cook and some of the fresh citrus character will be lost."},{"n":175,"name":"San Diego Scotch Ale (w/Ballast Point)","tagline":"Imperial Scotch Ale With Rum & Raisin.","first":"07/2012","desc":"Whisky cask aged with raisins soaked in rum. Warm, chocolatey and boozy with refreshing resinous bitterness and a lingering toasty biscuit background from the malt. Toasted oak comes courtesy of the barrels and spicy, sweet, dark fruit flavours from the rum soaked raisins.","abv":9,"ibu":70,"og":1090,"fg":1018,"ebc":190,"ph":4.4,"att":80,"batchL":20,"boilL":25,"mash":[[65,50]],"ferm":21,"twist":"Age in whisky casks with rum soaked raisins","malts":[["Pale Ale - Tipple",8.32],["Munich",1.79],["Crystal",1.19],["Dark Crystal",0.59],["Carafa Special Malt Type 1",0.12]],"hops":[["First Gold",125,"grams","start","bitter"],["Challenger",62.5,"grams","end","flavour"],["Amarillo",125,"grams","end","flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Venison stroganoff","Chilli dog","Toffee chocolate cheesecake"],"tips":"Soak oak chips in rum, then steep in the beer for the rum cash finish."},{"n":176,"name":"Old World India Pale Ale","tagline":"English India Pale Ale.","first":"10/2011","desc":"This recreated the epic IPAs that were sent on monumental ocean voyages from England to India by sea in the 1800s. Medium bodied with a complex malt profile, backed up with intense bitterness and a woodsy, earthy rich English hop character.","abv":7.5,"ibu":80,"og":1069,"fg":1012,"ebc":50,"ph":4.4,"att":82.6,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":22,"twist":null,"malts":[["Maris Otter Extra Pale",6.25],["Amber",0.25],["Crystal 150",0.25]],"hops":[["Bramling Cross",62.5,"grams","start","bitter"],["First Gold",50,"grams","end","flavour"],["Bramling Cross",50,"grams","end","flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Honey glazed ham with spicy roasted carrots","Mature cheddar with spicy chutney","Peach cobbler"],"tips":"In beers like this with a hefty malt bill, it pays to check a spoonful of the mash with some iodine solution. This will indicate if the mash has converted all of the starch into fermentable sugars. If the colour is very dark, just extend the mash rest by 10 mins and check again."},{"n":177,"name":"Dog D","tagline":"Anniversary Imperial Stout.","first":"05/2015","desc":"Dog D is an extra special brew, marking 8 years of BrewDog. Like Dog A, B & C before it, Dog D is an Imperial Stout with speciality ingredients, only this time we’ve barrel-aged it too. Dog D pours like dark matter into your glass, with a deep tan head. The nose is subtle but powerful, and on the palate, there’s a treacle toffee backbone, supporting the spicy hop flavour and naga chilli heat.","abv":16.1,"ibu":85,"og":1125,"fg":1015,"ebc":400,"ph":4.3,"att":84,"batchL":20,"boilL":25,"mash":[[63,90]],"ferm":21,"twist":"Add 1 naga chilli in the FV","malts":[["Pale Ale",7.5],["Wheat",0.5],["Flaked Oats",0.75],["Dark Crystal",0.75],["Carafa Special Malt Type 1",0.5],["Carafa Special Malt Type 3",0.5],["Rye",0.75],["Brown",0.75]],"hops":[["Chinook",50,"grams","start","bitter"],["Fuggles",25,"grams","middle","flavour"],["Fuggles",25,"grams","end","flavour"],["Willamette",25,"grams","end","flavour"],["Ginger Powder",1.5,"grams","end","flavour"],["Honey",1250,"grams","end","flavour"],["Cold Infused Coffee",25,"grams","end","flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Sriracha infused shredded beef","Chipotle steak tacos","Chilli chocolate fondant"],"tips":"Steep the coffee in the hot wort for short periods to get the best extraction of aromatic oils, without gaining too much bitterness."},{"n":178,"name":"Simcoe","tagline":"Single Hop India Pale Ale.","first":"01/2012","desc":"A special release of our IPA is Dead series - IPA is Dead Simoce. Hopped to hell with citrusy bitter and aroma hops from the West Coast of the USA. Bitter, orange, mandarin, floral, this IPA showcases the best the west has to offer.","abv":6.7,"ibu":70,"og":1063,"fg":1012,"ebc":30,"ph":4.4,"att":81,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":99,"twist":null,"malts":[["Extra Pale",4.75],["Caramalt",0.32],["Dark Crystal",0.06],["Munich",0.32]],"hops":[["Simcoe",2.5,"grams","start","bitter"],["Simcoe",25,"grams","middle","flavour"],["Simcoe",37.5,"grams","end","flavour"],["Simcoe",250,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Beer roasted chicken","Ham and pineapple pizza","Chocolate cake drizzled with orange"],"tips":"Get the freshest Simcoe for the best profile."},{"n":179,"name":"How To Disappear Completely","tagline":"Fake Fix Double IPA.","first":"04/2009","desc":"Jam-packed with two of our favourite hops - Columbus and Centennial, it has 198 (yes one hundred and ninety eight) theoretical IBUs. We use a lot of caramalt, some amber malt and some chocolate malt to give the little beer as much body and mouthfeel as possible and the ability to handle all the hops we threw at it. We think this beer is the world’s first ever Imperial Mild. Imperial in terms of hop profile. An Imperially Hopped Mild. BrewDog’s Imperial Mild. How to Disappear Completely.","abv":3.5,"ibu":198,"og":1037,"fg":1010,"ebc":37,"ph":4.4,"att":73,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Extra Pale",2],["Wheat Malt",0.31],["Munich",0.31],["Caramalt",0.63],["Pale Crystal 60",0.31],["Dark Crystal 350",0.081],["Amber",0.081],["Chocolate",0.081]],"hops":[["Centennial",25,"grams","start","bitter"],["Centennial",37.5,"grams","start","bitter"],["Centennial",12.5,"grams","start","bitter"],["Columbus",50,"grams","start","bitter"],["Centennial",25,"grams","middle","flavour"],["Columbus",25,"grams","middle","flavour"],["Centennial",18.8,"grams","end","flavour"],["Columbus",18.8,"grams","end","flavour"],["Galena",18.8,"grams","end","flavour"],["Simcoe",18.8,"grams","end","flavour"]],"yeast":"Wyeast 3522 - Belgian Ardennes™","food":["Spicy pork sausages with red potato mash","Turnip beef stew with crusty fresh baked bread","Summer berry cheesecake"],"tips":"Dry Hopping: Columbus 37.5g, Centennial 37.5g, Galena 37.5g, Horizon 37.5g"},{"n":180,"name":"Doodlebug","tagline":"Hoppy Sub-Session Pale Ale.","first":"09/2015","desc":"Doodlebug is our fusion of low strength and enormously high tropical hop levels – think a mashup of Hop Fiction and How to Disappear Completely, and you’re almost there. Clocking in at 2.8% ABV, Doodlebug is keg-only and is packed with Amarillo, Chinook and Mosaic; letting fly a hoppy buzzbomb at sub-session-strength.","abv":2.5,"ibu":35,"og":1027,"fg":1008,"ebc":10,"ph":4.2,"att":70.4,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":19,"twist":null,"malts":[["Pilsner",1.69],["Wheat",0.38],["Flaked Oats",0.13]],"hops":[["Chinook",2.5,"grams","start","bitter"],["Amarillo",37.5,"grams","end","flavour"],["Chinook",25,"grams","end","flavour"],["Mosaic",37.5,"grams","end","flavour"],["Amarillo",62.5,"grams","dry hop","aroma"],["Chinook",62.5,"grams","dry hop","aroma"],["Mosaic",62.5,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Lightly curried spiced chickpea dip","Fried calamari with a mild sauce","Lemon sherbet cookies"],"tips":"Wheat and flaked oats can help to add to the body of the beer. This makes up for the lack of alcoholic bite."},{"n":181,"name":"Vic Secret","tagline":"Single Hop India Pale Ale.","first":"10/2013","desc":"Piney, citrusy and resinous with herbal notes, Vic Secret is dual-purpose (flavour & bitterness) perfect for brewing up a single hop IPA.","abv":7.4,"ibu":70,"og":1069,"fg":1012,"ebc":30,"ph":4.4,"att":82.6,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Extra Pale",6.4],["Caramalt",0.63],["Dark Crystal",0.06]],"hops":[["Vic Secret",2.5,"grams","start","bitter"],["Vic Secret",25,"grams","middle","flavour"],["Vic Secret",37.5,"grams","end","flavour"],["Vic Secret",250,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Roasted duck","Gorgonzola and rye nut bread with smoked honey ham","Raspberry coffee cheesecake"],"tips":"You can always add more hops, but it is difficult to take them away. Carry out multiple additions of the hops during dry hopping to achieve the best profile."},{"n":182,"name":"All Day Long - Prototype Challenge","tagline":"Malty Low ABV Ale.","first":"11/2014","desc":"Prototype Challenge 2014. All Day Long is a mild like no other. This complex, low-alcohol brew was the third of our 2014 Prototypes. Featuring a boatload of seven different speciality malts and some of our favourite hops, this beer is resinous at first, transitioning into something akin to bitter orange marmalade spread onto a thick bread crust. This is for everyone who said BrewDog would never brew a mild...","abv":2.8,"ibu":30,"og":1032.5,"fg":1012,"ebc":42,"ph":4.4,"att":63.1,"batchL":20,"boilL":25,"mash":[[65,30]],"ferm":22,"twist":null,"malts":[["Caramalt",3.13]],"hops":[["Columbus",8.5,"grams","start","bitter"],["Cascade",20.5,"grams","end","flavour"],["Centennial",20.5,"grams","end","flavour"],["Columbus",20.5,"grams","end","flavour"],["Ahtanum",20.5,"grams","end","flavour"],["Centennial",75,"grams","dry hop","aroma"],["Cascade",75,"grams","dry hop","aroma"],["Amarillo",100,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Chunky orange marmalade on toast","Prawn toast with sweet chilli sauce","Lemon tart"],"tips":"In any low ABV fermentation after primary fermentation has finished if the beer smells or tastes like wort, allo ops."},{"n":198,"name":"AB:01","tagline":"Vanilla Bean Infused Belgian Quad.","first":"02/2010","desc":"Made with the yeast from a bottle of Westvleteren 12, aged with vanilla beans. Only available in 375ml bottles. Limited to 3200 bottles. The first in our Abstrakt series.","abv":10.2,"ibu":20,"og":1095,"fg":1018,"ebc":16,"ph":4.1,"att":8.1,"batchL":20,"boilL":25,"mash":[[63,90]],"ferm":22,"twist":"Two split vanilla pods in cold conditioning","malts":[["Extra Pale",7.75],["Wheat",0.5],["Munich",0.5]],"hops":[["Saaz",25,"grams","start","bitter"],["Saaz",15,"grams","end","flavour"],["Styrian Goldings",15,"grams","end","flavour"]],"yeast":"Westvleteren 12 (recovered from a bottle)","food":["Baked brown butter lobster","Apple crumble and custard","Coffee carrot cake"],"tips":"To capture yeast from another bottle conditioned beer, simply make up a starter with some wort and grow the yeast up. Once it goes through a fermentation at 1 litre it can go straight into your wort to start the main fermentation."},{"n":199,"name":"Alice Porter","tagline":"Enigmatic Dark Alchemy.","first":"09/2010","desc":"First brewed in 2010, Alice Porter returned as a seasonal in 2015. The beer was originally created and brewed for (real life) Alice Porter’s impending nuptials to the Beer King of Leeds, Matt Gorecki.","abv":5.2,"ibu":55,"og":1053,"fg":1013,"ebc":165,"ph":5.2,"att":75.5,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":19,"twist":null,"malts":[["Extra Pale",2.63],["Munich",0.88],["Crystal 150",0.38],["Special W",0.31],["Carafa Special Malt Type 1",0.44],["Flaked Oats",0.38],["Torrified Wheat",0.31]],"hops":[["Magnum",5,"grams","start","bitter"],["First Gold",25,"grams","middle","flavour"],["First Gold",25,"grams","end","flavour"],["Sorachi Ace",25,"grams","end","flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Applewood cheddar bacon beef burger","Roasted garlic camembert","Parmesan truffles"],"tips":"The Sorachi Ace hop addition at the end of the boil gives the beer a art","bitter"],["Waimea",20,"grams","middle","flavour"],["Waimea",37.5,"grams","end","flavour"],["Waimea",125,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Hot spiced barbecue chicken wings","Orange sesame chicken","Chocolate fondue with fruit"],"tips":"Use the freshest hops for the most impact."},{"n":202,"name":"Dog C","tagline":"Cacao, Coffee Chili Anniversary Stout.","first":"05/2014","desc":"Our anniversary stout was based on AB:04, one of our most sought after beers ever. This beer is slightly different each year, with subtle variations coming into play purely down to environmental and fermentation factors. What doesn't change is the rich dark chocolate, bitter coffee and chilli warmth of this monumental stout.","abv":15,"ibu":90,"og":1120,"fg":1003,"ebc":100,"ph":4.4,"att":98,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":19,"twist":"Based on AB:04, but with added vanilla and 3.5 times the chilli.","malts":[["Extra Pale",7.5],["Wheat",0.5],["Flaked Oats",1.38],["Dark Crystal",0.88],["Carafa Special Malt Type 1",0.63],["Carafa Special Malt Type 3",0.63],["Rye",0.75],["Honey",0.5]],"hops":[["Chinook",50,"grams","start","bitter"],["Cascade",25,"grams","start","bitter"],["Fuggles",25,"grams","middle","flavour"],["Coffee",12.5,"grams","middle","flavour"],["Fuggles",25,"grams","end","flavour"],["Coffee",12.5,"grams","end","flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Blackened cajun beef","Blue cheese","Flourless chocolate cheesecake"],"tips":"Be really careful when mashing, as this amount of malts can get tough to sparge! Add honey into the boil, and naga chilli and vanilla in maturation (soak them in some neutral spirit to sanitise)."},{"n":203,"name":"Bitch Please (w/ 3 Floyds)","tagline":"Barley Wine - 3 Floyds Collab.","first":"02/2012","desc":"This limited edition American Barley Wine was brewed in collaboration with 3 Floyds Brewery. This beer had all the warm, boozy and smoky aspects of an Islay Scotch whisky with the sweet malt and devastatingly bitter attributes of a barley wine. Peat smoke features prominently, backed up with a complex fruity hop profile.","abv":11.5,"ibu":50,"og":1104,"fg":1016,"ebc":38,"ph":4.4,"att":85,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":21,"twist":"Two bars of Highland Toffee at start of boil","malts":[["Extra Pale",8.21],["Pinhead Oats",0.36],["Carahell",0.18],["CaraAroma",0.18],["Roasted Malt",0.09],["Peated Malt",0.09]],"hops":[["Green Bullet",50,"grams","start","bitter"],["Motueka",35.5,"grams","end","flavour"],["Pacific Gem",21.5,"grams","end","flavour"],["Nelson Sauvin",7,"grams","end","flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Stilton Blue featured cheese platter","Dark bitter chocolate torte","Scotch bonnet beef chilli"],"tips":"To add to the smoky nature of this Barley Wine, source some smoked wood or whisky casks to age the beer in."},{"n":204,"name":"Cascade, Centennial & Willamette IPA - B-Sides","tagline":"Pilot Kit IPA.","first":"01/2016","desc":"An experiment in balancing hops on the pilot kit. Grapefruit, orange and resin to the fore.","abv":6.4,"ibu":65,"og":1060,"fg":1011,"ebc":14,"ph":5.2,"att":82,"batchL":20,"boilL":25,"mash":[[60,10],[65,30],[72,10],[78,5]],"ferm":19,"twist":null,"malts":[["Propino Pale Malt",5],["Dextrin Malt",0.63],["Flaked Oats",0.63]],"hops":[["Centennial",25,"grams","start","bitter"],["Cascade",21.25,"grams","end","flavour"],["Willamette",21.25,"grams","end","flavour"]],"yeast":"Wyeast 1056 - American Ale™ & Wyeast 1272 - American Ale II™","food":["Cauliflower pakora with mango chutney","Penne with tomato and smoked cheese","Salted caramel ice cream and peanuts"],"tips":"Hold off on the dry hops. You want to know how well you balanced the brew house."},{"n":205,"name":"Shareholder Black IPA 2011","tagline":"Shareholder Black IPA.","first":"12/2011","desc":"Brewed as part of the shareholder brewday at our Fraserburgh brewery. Massively dry hopped and aged on toasted oak chips, this IPA was a riot of lemon, vanilla and roasted malt.","abv":7.1,"ibu":80,"og":1067,"fg":1014,"ebc":71,"ph":4.4,"att":79,"batchL":20,"boilL":25,"mash":[[66,90]],"ferm":19,"twist":"Several dozen brewers!, Toasted oak chips: 75g at FV","malts":[["Maris Otter Extra Pale",6.57],["Caramalt",0.75],["Crystal 150",0.32],["Carafa Special Malt Type 1",0.5]],"hops":[["Amarillo",25,"grams","start","bitter"],["Columbus",25,"grams","start","bitter"],["Chinook",62.5,"grams","end","flavour"],["Columbus",62.5,"grams","end","flavour"],["Cascade",62.5,"grams","end","flavour"],["Centennial",62.5,"grams","end","flavour"],["Centennial",125,"grams","dry hop","aroma"],["Cascade",62.5,"grams","dry hop","aroma"],["Amarillo",62.5,"grams","dry hop","aroma"],["Chinook",62.5,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Classic American cheeseburger","Chilli chocolate bars"],"tips":"Get as many Equity Punks involved. You can toast the oak chips yourself in an oven."},{"n":206,"name":"Black Jacques","tagline":"Red Wine Barrel-Aged Imperial Black Saison.","first":"06/2013","desc":"A Black Saison, brewed with oats and wheat for a silky mouthfeel, Spicy hops and Carafa Malt for colour, then aged in red wine barrels. On the nose there's cola, chocolate, coffee, mint humbug, warming oak, and spice. The myriad flavours touch on treacle, ripe banana, espresso, brandy, and a clean herbal warmth.","abv":11.1,"ibu":45,"og":1089,"fg":1005,"ebc":15,"ph":4.4,"att":94.4,"batchL":20,"boilL":25,"mash":[[65,90]],"ferm":23,"twist":"Grains of paradise: 10g at End (WP), Lemon Peel: 25g at End (WP), Ginger: 7.5g at End (WP)","malts":[["Extra Pale",6],["Caramalt",0.5],["Wheat",0.5],["Flaked Malted Oats",0.5],["Crystal 150",0.63],["Carafa Special Malt Type 3",0.75]],"hops":[["Bravo",25,"grams","start","bitter"],["Bravo",12.5,"grams","middle","flavour"],["Mt.Hood",25,"grams","middle","flavour"],["Bravo",12.5,"grams","end","flavour"],["Mt.Hood",25,"grams","end","flavour"]],"yeast":"Wyeast 3711 - French Saison™","food":["Cured Spanish ham","Steak pasty","Black cherry tart"],"tips":"Addition of the grains of paradise help to accentuate the peppery spiciness of the yeast."},{"n":207,"name":"International Arms Race (w/ Flying Dog)","tagline":"Zero IBU Herbal IPA.","first":"08/2012","desc":"The International Arms Race was a new type of battle collaboration between hardcore American craft brewery Flying Dog and BrewDog. Both breweries attempted to brew an IPA with absolutely no hops.","abv":7.5,"ibu":0,"og":1069,"fg":1013,"ebc":50,"ph":4.4,"att":81.1,"batchL":20,"boilL":25,"mash":[[69,null]],"ferm":19,"twist":"Juniper Berries: 25g at start, Bay Leaves: 2.75g at start, Rosemary: 7.5g at start, Rosemary: 5g at end, Elderflower: 15g at end, Juniper Berries: 25g at end","malts":[["Maris Otter Extra Pale",6],["Caramalt",0.75],["Crystal 150",0.25]],"hops":[["Bay Leaves",5,"grams","dry hop","aroma"],["Rosemary",25,"grams","dry hop","aroma"],["Elderflower",10,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Rosemary and thyme grilled chicken","Light vegetable and herb soup with toasted rye bread","Earl Grey ice cream with a lavender sauce"],"tips":"Allow the bay leaves to steep in the boil for extra time to extract some bitterness. The bitterness is really important to bring balance to an otherwise sweet beer."},{"n":208,"name":"Sunshine On Rye - B-Sides","tagline":"Hoppy Rye IPA.","first":"02/2015","desc":"A Pilot Brew \\"Sunshine on Rye\\" uses loads of spicy malt and coriander to play nice with an inhuman amount of hops!","abv":7.2,"ibu":130,"og":1065,"fg":1010,"ebc":14,"ph":5.2,"att":87,"batchL":20,"boilL":25,"mash":[[60,10],[65,30],[72,10],[78,5]],"ferm":20,"twist":"Indian Coriander: 2.5g","malts":[["Extra Pale",5],["Rye",0.63],["Caramalt",0.25]],"hops":[["Amarillo",17.5,"grams","start","bitter"],["Citra",17.5,"grams","start","bitter"],["Simcoe",17.5,"grams","start","bitter"],["Amarillo",17.5,"grams","middle","flavour"],["Citra",17.5,"grams","middle","flavour"],["Simcoe",17.5,"grams","middle","flavour"],["Amarillo",17.5,"grams","end","aroma"],["Citra",17.5,"grams","end","flavour"],["Simcoe",17.5,"grams","end","aroma"],["Nelson Sauvin",22.5,"grams","end","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Jerk spiced goat","Tonkotsu Ramen","Gingerbread"],"tips":"Indian coriander accentuates the citrus character from the hops. Use fresh spices to really accentuate this relationship."},{"n":209,"name":"Stereo Wolf Stout - Prototype Challenge","tagline":"Dark Audio Storm.","first":"02/2015","desc":"Roasty, dark and complex, Stereo Wolf is a 5.2% ABV Stout brewed with a cacophony of hop-driven fruit and spice. Dark chocolate stalks alongside the resonating bitterness, through to Stereo Wolf’s lingering dry finish. Balancing roasty malt and new world hops at 5.2% ABV is no mean feat, but Stereo Wolf takes it in its stride.","abv":5.2,"ibu":55,"og":1052,"fg":1014,"ebc":200,"ph":5.2,"att":73.1,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Extra Pale",2.5],["Flaked Oats",0.63],["Special W",0.38],["Roasted Barley",0.38],["Carafa Special Malt Type 1",0.38],["Wheat",0.63]],"hops":[["Galena",7.5,"grams","start","bitter"],["Bramling Cross",12.5,"grams","middle","flavour"],["Willamette",25,"grams","end","flavour"],["Centennial",25,"grams","end","flavour"],["Centennial",62.5,"grams","dry hop","aroma"],["Willamette",62.5,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Mississippi style pork ribs","Chunky mild spice beef stew","Chocolate chunky cookies"],"tips":"Special W is a specialty malt that creates an intense profile of nuts, raisins and caramel. It provides a focal point for the malt base, that the hops can stack against."},{"n":210,"name":"Dead Metaphor","tagline":"Scottish Breakfast Stout.","first":"09/2013","desc":"Scottish chocolate breakfast Stout - brewed with Brazilian Sertão coffee, Venezuelan cacao and (for the Scottish element) oatmeal. Smooth, chocolately and rich, with a honeycomb mouthfeel and a rich red berry coffee character. Brewed with our beer blogger friends from The Beer Cast and Hopzine.","abv":6.8,"ibu":30,"og":1068,"fg":1016,"ebc":86,"ph":4.4,"att":76.5,"batchL":20,"boilL":25,"mash":[[64,75]],"ferm":19,"twist":"Cacao: 37.5g at end, Lactose: 125g at end, Ground Coffee: 6.3g at end.","malts":[["Extra Pale",4.38],["Wheat",0.31],["Dark Crystal",0.19],["Brown",0.31],["Black Malt",0.31],["Carafa Special Malt Type 1",0.19],["Flaked Oats",0.44],["Crystal 150",0.31]],"hops":[["Magnum",25,"grams","start","bitter"]],"yeast":"Wyeast 1056 - American Ale™","food":["Brisket burnt ends","Candied bacon French toast","Coco Pops (add stout to cereal)"],"tips":"Steep the cocoa nibs and chocolate in the hot wort for a short period for the best extraction of flavour compounds."},{"n":211,"name":"Black Dog","tagline":"Hoppy Black Wheat Stout.","first":"11/2009","desc":"We thought it would be great if Jeremy Moynier from Stone Brewing Co. brewed his own beer while he was here, with Jeremy deciding everything right down to the name! The result is a special 20HL batch of BlackDog, a 5.5% dark wheat stout with Columbus, Simcoe and Chinook and of course plenty of dry hopping action.","abv":5.5,"ibu":60,"og":1062,"fg":1020,"ebc":230,"ph":4.4,"att":67.7,"batchL":20,"boilL":25,"mash":[[68,90]],"ferm":19,"twist":null,"malts":[["Extra Pale - Spring Blend",4.15],["Caramalt",1.12],["Crystal 150",0.56],["Chocolate",0.38],["Roasted Barley",0.31],["Wheat Malt",0.63]],"hops":[["Columbus",31.3,"grams","start","bitter"],["Columbus",12.5,"grams","middle","flavour"],["Simcoe",12.5,"grams","middle","flavour"],["Chinook",12.5,"grams","middle","flavour"],["Columbus",25,"grams","end","flavour"],["Simcoe",25,"grams","end","flavour"],["Chinook",25,"grams","end","flavour"],["Columbus",87.5,"grams","dry hop","aroma"],["Simcoe",87.5,"grams","dry hop","aroma"],["Chinook",75,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Spicy chicken and chilli verde sauce enchiladas","Smoked chorizo and strong cheese board"],"tips":"By soaking some oak chips in bourbon, then steeping in the beer, you not only get an authentic bourbon taste - the beer will also gain ABV! Add salt to taste but beware - too much will totally ruin the balance of the beer."},{"n":212,"name":"Hop Fiction - Prototype Challenge","tagline":"US-Style Pale Ale.","first":"11/2014","desc":"Hop Fiction is an explosively tropical US-style Pale Ale. We rolled up our hop-dusted sleeves and put some advanced brewing techniques to work on this seasonal brew. Hop Fiction’s incredible aromas and flavours are down to a combination of early and late hops. Bags of soft, rounded citrus and stone fruit layer up on a dry light biscuit backbone. Hop Fiction, beer fact.","abv":5.2,"ibu":40,"og":1048,"fg":1010,"ebc":13,"ph":4.4,"att":79.2,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":19,"twist":null,"malts":[["Pale Ale",4.38]],"hops":[["Chinook",12.5,"grams","start","bitter"],["Amarillo",37.5,"grams","end","flavour"],["Chinook",25,"grams","end","flavour"],["Mosaic",37.5,"grams","dry hop","aroma"],["Amarillo",62.5,"grams","dry hop","aroma"],["Chinook",62.5,"grams","dry hop","aroma"],["Mosaic",62.5,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Jalapeño and cream cheese poppers","Asparagus pesto pasta","Bacon and maple syrup cupcakes"],"tips":"Don't be scared by the amount of hops. Seriously this beer can handle them."},{"n":213,"name":"El Dorado - IPA Is Dead","tagline":"Single Hop India Pale Ale.","first":"02/2013","desc":"The Pacific North West of America grows remarkable hops and El Dorado is a killer example of this. A new hop on the block, loaded with tropical fruits, pear, watermelon, candy floss and stone fruit.","abv":6.7,"ibu":70,"og":1066,"fg":1015,"ebc":30,"ph":4.4,"att":77.3,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Extra Pale",5],["Caramalt",0.31],["Dark Crystal",0.06],["Munich",0.31]],"hops":[["El Dorado",3.75,"grams","start","bitter"],["El Dorado",12.5,"grams","middle","flavour"],["El Dorado",37.5,"grams","end","flavour"],["El Dorado",125,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Watermelon and feta salad with balsamic reduction","Grilled chicken with a chilli soy sauce marinade","Crème brûlée with apricot coulis"],"tips":"El Dorado works well on its own but pairs up brilliantly with a higher alpha hop for bittering, saving your El Dorado for aroma and flavour."},{"n":214,"name":"Cult Lager","tagline":"US & New Zeland Hopped Lager","first":"04/2008","desc":"A lager that actually tastes of something? You have to be kidding, right? Cult lager is made with 100% malt and whole leaf hops. Maybe we are crazy, so what? Taste our lager and we are pretty sure that you will agree that the fine line between insanity and genius has just become a little more blurred.","abv":5.4,"ibu":50,"og":1008,"fg":1049,"ebc":19,"ph":4.1,"att":83.7,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":10,"twist":null,"malts":[["Lager Malt",4.66]],"hops":[["Saaz",12.5,"grams","start","bitter"],["Cascade",12.5,"grams","start","bitter"],["Cascade",25,"grams","end","flavour"],["Chinook",25,"grams","end","flavour"],["Motueka",12.5,"grams","end","flavour"]],"yeast":"Saflager S189","food":["Arrabiata pasta with grilled prawns","Mexican spiced chicken with hot sauce","Orange marmalade thumb print cookie"],"tips":"When the fermentation is nearly complete, allow the temperature of the beer to rise. This will scrub some of the undesirable flavours out."},{"n":215,"name":"Brixton Porter","tagline":"Paradigm-Changing Porter.","first":"11/2013","desc":"Brixton Porter delivers bold chocolate and coffee flavours with light smokiness and hints of autumn fruit all but built on a low ABV, lighter bodied backbone. Complex and intriguing, with spicy bitterness, but very sessionable.","abv":5,"ibu":50,"og":1053,"fg":1014,"ebc":200,"ph":4.4,"att":73.6,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Extra Pale",3.8],["Dark Crystal",0.19],["Roasted Barley",0.31],["Black Malt",0.13],["Amber",0.31],["Flaked Oats",0.25]],"hops":[["Bravo",12.5,"grams","start","bitter"],["Bramling Cross",12.5,"grams","middle","flavour"],["Challenger",12.5,"grams","middle","flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Grilled rib-eye steak","Baked curry chickpea snacks","Chocolate and walnut brownie"],"tips":"After the primary fermentation has finished, leave the beer in contact with the yeast for around 48 hours. Any longer and there is a risk that it will start to impart yeasty, bready flavours to the beer."},{"n":216,"name":"Barrel Aged Hinterland","tagline":"A Most Beguiling Brew. Aged In Bourbon Casks.","first":"06/2016","desc":"Hinterland is a beer long in the creation, and even longer in the appreciation. On the aroma, deep reverberating roasty bitterness and sweet dark chocolate. Also in evidence, woodsmoke, rich vanilla, mocha and marzipan. When tasting, Hinterland reveals itself as the beer moves from cellar temperature to something warmer, yielding all of the above plus dried fruit, rich ganache and ending on a resoundingly warming  nish redolent of chocolate liqueur or plum brandy. Aged in Bourbon Casks.","abv":9,"ibu":85,"og":1094,"fg":1025,"ebc":400,"ph":4.3,"att":73.4,"batchL":20,"boilL":25,"mash":[[65,null]],"ferm":21,"twist":"Lactose (Milk Sugar): 500g at middle","malts":[["Pale Ale",6.88],["Wheat",0.5],["Flaked Oats",1],["Dark Crystal",0.5],["Carafa Special Malt Type 1",0.75],["Chocolate",1]],"hops":[["Bramling Cross",12.5,"grams","start","bitter"],["Bramling Cross",12.5,"grams","start","bitter"],["Sorachi Ace",12.5,"grams","middle","flavour"],["Sorachi Ace",25,"grams","end","flavour"],["Willamette",25,"grams","end","flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Mulled cheddar buffalo burger","Venison with warm spices (cardamom) and sweet potato","Pure
