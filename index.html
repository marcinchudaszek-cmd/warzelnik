ther fucking mast – independence or death."},{"n":220,"name":"Ace Of Simcoe","tagline":"Single-Hopped Session IPA.","first":"01/2016","desc":"We love hops. We adore and worship their profile ability to transform beer. You could say that we have a terminal addiction. To celebrate this fetish we’re heroing our favourites in single hopped limited releases. No also starring, no extras, no compromise. The Hop is the Hero. A biscuity malty backbone builds to resinous pine with explosive citrus notes, culminating in a mango hit and a long bitter finish. This is pure Hop fusion, imploding with sensory overload. Our Ace in the hole, devastatingly singular, deliciously bitter. Serving up an Ace each and every time.","abv":4.5,"ibu":40,"og":1045,"fg":1011,"ebc":18,"ph":4.2,"att":75.6,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Pale Ale",2.3],["Maris Otter",1.3],["Caramalt",0.5]],"hops":[["Simcoe",3.75,"grams","start","bitter"],["Simcoe",12.5,"grams","middle","flavour"],["Simcoe",37.5,"grams","end","flavour"],["Simcoe",187.5,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Reuben sandwich","Halloumi and sweet chili burger","Passionfruit meringue pie"],"tips":"Try adding a small portion of the hops to the kettle before you boil, as first wort hops."},{"n":221,"name":"Blitz Series","tagline":"Fruit Infused Berlinerweisse.","first":"06/2016","desc":"We are bringing back our Blitz Series to 2016. Every Blitz we brew is different, due to the spontaneous souring process, and each version has a great blend of all the different flavours we look for in a Berlinerwiesse.","abv":3.2,"ibu":8,"og":1007,"fg":1032,"ebc":8,"ph":3.2,"att":78,"batchL":20,"boilL":25,"mash":[[49,30],[59,20],[72,15]],"ferm":21,"twist":"Conversion check 78°C run off.","malts":[["Pale Ale",1.6],["Wheat",1.6]],"hops":[["Bramling Cross",10,"grams","start","flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Cheese boards","Sashimi sushi","French fries dressed in good oil and salt","Mac and Cheese"],"tips":"When you have a good lactobacillus culture grown take half of an fv of it and add some fresh wort. This will keep the culture alive as long as you keep it warm, oxygen free and keep releasing the pressure. You can then use this liquid culture on the next brew and reuse it over and over and over and over and over...like sourdough starter!"},{"n":222,"name":"Dog E","tagline":"Ninth Anniversary Imperial Stout.","first":"06/2016","desc":"Dog E is a very special beer. This beer commemorates our 9th year in 2016. This beer originally appeared as AB:04 in 2010, perhaps the most sought after beer we ever brewed. Dog E is a 16.1% Imperial Stout brewed with copious amounts of dark malts, pure cacao and coffee, balanced by the subtle addition of naga chili, and barrel-aged. Perfect for ageing in your cellar, or drinking fresh if you’re lucky enough to get your paws on a bottle.","abv":16.1,"ibu":100,"og":1015,"fg":1125,"ebc":500,"ph":4.4,"att":84,"batchL":20,"boilL":25,"mash":[[63,90]],"ferm":21,"twist":"5g Habanero and 3g lemon drop chili in FV","malts":[["Pale Ale",7.5],["Wheat",0.5],["Flaked Oats",0.75],["Dark Crystal",0.75],["Carafa Special Malt Type 1",0.5],["Carafa Special Malt Type 3",0.5],["Rye",0.75],["Brown",0.75]],"hops":[["Chinook",25,"grams","start","bitter"],["Sorachi Ace",50,"grams","start","bitter"],["Ginger Powder",1.25,"grams","end","flavour"],["Honey",1250,"grams","end","flavour"],["Cold Infused Coffee",25,"grams","end","flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Char sui pork buns","Spicy beef empanadas","Chocolate cheesecake"],"tips":"With stronger styles (like imperial stouts), feel free to cellar your beer and try a bottle every few months to see how the flavours have developed – often the beer picks up new, incredible flavours."},{"n":223,"name":"Prototype Pils 2.0","tagline":"Revamped German Pils.","first":"06/2016","desc":"Our spin on a light, dry and bitter German lager. Hop driven with malt taking a back seat, Pils 2.0 is lined up to become a regular brew.","abv":4.7,"ibu":25,"og":1008,"fg":1044,"ebc":25,"ph":4.2,"att":75.6,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":12,"twist":null,"malts":[["Pilsner",1.3],["Caramalt",0.12],["Munich",0.5],["Pale Ale",1.2]],"hops":[["Magnum",4,"grams","start","bitter"],["Perle",20,"grams","middle","flavour"],["Perle",10,"grams","end","aroma"]],"yeast":"Wyeast 2007 - Pilsen Lager™","food":["Tuna & salmon sushi (with plenty of wasabi!)","Chipotle chicken burrito","Rhubarb fool with shortbread"],"tips":"Allow plenty of time for lagering with this brew to make sure you get the clean and crisp flavour profile."},{"n":224,"name":"AB:20","tagline":"Tiramisu Barley Wine.","first":"06/2016","desc":"An English Barley Wine brewed with coffee and milk, with rich toasty & caramel flavours. To complete the tiramisu effect, we’ve blended this with a 3 year rum cask aged Imperial Stout.","abv":14.2,"ibu":20,"og":1025,"fg":1120,"ebc":67,"ph":4,"att":75.6,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":21,"twist":null,"malts":[["Pale Ale",4.2],["Premium English Caramalt",0.2],["DRC",0.2],["Flaked Oats",1.2]],"hops":[["Magnum",10.2,"grams","start","bitter"],["Coffee",60,"grams","middle","flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Cornish Yarg","Vanilla & raspberry panna cotta","Wild boar salami"],"tips":"Use only very dry coffee beans like Sumatran ones. This way your head retention will not be affected by the oils from the beans."},{"n":225,"name":"Paradox Islay 2.0","tagline":"Islay Cask-Aged Imperial Stout.","first":"06/2016","desc":"Intense peaty smoke layers on decadent roast coffee and chocolate in our Islay barrels aged paradox stout. One of the smokiest beers we have ever produced.","abv":13,"ibu":100,"og":1015,"fg":1112,"ebc":300,"ph":4.4,"att":84.4,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":21,"twist":null,"malts":[["Pale Ale",2.6],["Caramalt",0.35],["Munich",0.2],["Flaked Oats",0.8],["Dark Crys uity malty backbone builds to intense tropical fruit, with bitter resin notes, culminating with an explosive papya hit and a long bitter finish. Our Ace in the hole, devastatingly singular, deliciously bitter. Serving up an Ace each and every time.","abv":4.5,"ibu":40,"og":1045,"fg":1011,"ebc":18,"ph":4.2,"att":75.6,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Pale Ale",2.3],["Maris Otter",1.3],["Caramalt",0.5]],"hops":[["Equinox",3.75,"grams","start","bitter"],["Equinox",10,"grams","middle","flavour"],["Equinox",37.5,"grams","end","flavour"],["Equinox",187.5,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Chicken, mango and chili salad","Deep fried coconut prawns","Pineapple upside down cake"],"tips":"If you are struggling with the malt hop balance, try upping the speciality malt a little bit until you hit your sweet spot."},{"n":233,"name":"Ace Of Citra","tagline":"Single-Hopped Session IPA.","first":"01/2016","desc":"We love hops. We adore and worship their profile ability to transform beer. You could say that we have a terminal addiction. To celebrate this fetish we’re heroing our favourites in single hopped limited releases. No also starring, no extras, no compromise. The Hop is the Hero. A biscuity malty backbone layered with berry and resin, culminating with a lime zest hit and an explosive bitter citrus finish. Our Ace in the hole, devastatingly singular, deliciously bitter. Serving up an Ace each and every time.","abv":4.5,"ibu":40,"og":1045,"fg":1011,"ebc":18,"ph":4.2,"att":75.6,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Pale Ale",2.3],["Maris Otter",1.3],["Caramalt",0.5]],"hops":[["Citra",3.75,"grams","start","bitter"],["Citra",12.5,"grams","middle","flavour"],["Citra",37.5,"grams","end","flavour"],["Citra",187.5,"grams","dry hop","aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Courgette fries","Curried sea bass","Pistachio layer cake"],"tips":"Let the wort sit ander Seed",4,"grams","whirlpool","aroma"],["Mango",500,"grams","secondary","flavour"],["1 lemon drop chilli",1,"total","maturation","flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Vegetable Samosas","Thai Green Chicken Curry","Vanilla Panna Cotta"],"tips":"Crack open the chili and add it in a muslin bag so you can take it out when the chilli heat suits you"},{"n":236,"name":"Science IPA","tagline":"India Pale Ale","first":"2016","desc":"A beer brewed specifically for the British Science Festival, held in Swansea.","abv":5,"ibu":null,"og":1050,"fg":1011,"ebc":24,"ph":4.4,"att":77,"batchL":20,"boilL":25,"mash":[[60,30],[65,20],[72,15],[78,10]],"ferm":21,"twist":null,"malts":[["Maris Otter",4],["Dark Crystal",0.35]],"hops":[["Centennial",20,"grams","60","bitter"],["Cascade",20,"grams","30","flavour"],["Amarillo",40,"grams","whirlpool","aroma"],["Cascade",25,"grams","dry hop","aroma"],["Amarillo",25,"grams","dry hop","aroma"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Chicken Katsu","Cheese and Ham Omelette","Pumpkin Pie"],"tips":"This beer is all about the balance between the malty backbone of the beer and the fresh hop aroma. The fresher the hops the better."},{"n":237,"name":"Honey And Lemon Blitz","tagline":"Honey & Lemon Infused Berliner Weisse.","first":"2016","desc":"Honey & Lemon Blitz sees tart Berliner Weisse character multiplied by lemony acidity; light bready malt and a hint of warming honey hold this back from the brink of palate- destroying sourness.","abv":3.2,"ibu":null,"og":1039,"fg":1008,"ebc":8,"ph":3.2,"att":75,"batchL":20,"boilL":25,"mash":[[60,30],[65,20],[72,15],[78,10]],"ferm":21,"twist":"Following souring steps outlined in Blitz Series recipes","malts":[["Pilsner",1],["Wheat",1],["Munich",0.75],["Flaked Oats",0.2],["Smoked Malt",0.06]],"hops":[["Perle",6,"grams","15","bitter"],["Lemon Peel",12,"grams","15","aroma"],["Honey",10,"grams","15","flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Herb-Crusted Baked Cod","Berry and Cream Meringue","Lemon Drizzle Cake"],"tips":"Be careful not to over do the smoked malt as it's just a background flavour and you don’t want it to be prominent in the finished beer."},{"n":238,"name":"Kingpin","tagline":"21st century lager.","first":"2016","desc":"A 4.7% German Pils with light, biscuit and toasty malt character, upon which is built a hop bitterness that provides complexity and a long, dry finish.","abv":4.7,"ibu":40,"og":1044,"fg":1008,"ebc":14,"ph":4.2,"att":79,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":10,"twist":null,"malts":[["Pilsner",1.63],["Caramalt",0.16],["Munich",0.63],["Pale Ale",1.5]],"hops":[["Magnum",5,"grams","Start","Bitter"],["Perle",25,"grams","Middle","Flavour"],["Perle",12.5,"grams","End","Flavour"]],"yeast":"Wyeast 2007 - Pilsen Lager™","food":["Jamaican jerk chicken wings","Corn dogs","Strawberry ice cream sundae"],"tips":"Keep an eye on your fermentation temperature to ensure you get the crisp notes that are the hallmark of a good pilsner."},{"n":239,"name":"#Mashtag 2016","tagline":"Sour cherry triple IPA.","first":"2016","desc":"We gave our customers the keys to the brewery and let them choose every aspect of this beer. Sour cherry combines with fruity hop character against a biscuit malt backbone with a hint of alcohol warmth, and an oaky undercurrent.","abv":10.5,"ibu":100,"og":1090,"fg":1010,"ebc":15,"ph":4.4,"att":89.04,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":21,"twist":"250g Sour Cherries, 5g Oak Chips","malts":[["Pale Ale",6.3],["Dextrose",1]],"hops":[["Columbus",10,"grams","Start","Bitter"],["Simcoe",25,"grams","End","Flavour"],["Mosaic",25,"grams","End","Flavour"],["Citra",25,"grams","End","Flavour"],["Amarillo",25,"grams","End","Flavour"],["Simcoe",50,"grams","Dry Hop","Aroma"],["Mosaic",50,"grams","Dry Hop","Aroma"],["Citra",50,"grams","Dry Hop","Aroma"],["Amarillo",50,"grams","Dry Hop","Aroma"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Confit duck with cherry sauce","Cajun ribs","Buttermilk waffles"],"tips":"Rope in as many friends as you can to make it a truly democratic brew."},{"n":240,"name":"Blitz Saison","tagline":"Lemon & coriander Berliner Weisse","first":"2016","desc":"Belgium meets Berlin – incredible saison character with a bright and vibrant sour edge.","abv":3.2,"ibu":8,"og":1040,"fg":1007,"ebc":7,"ph":3.2,"att":77,"batchL":20,"boilL":25,"mash":[[60,30],[65,20],[72,15],[78,10]],"ferm":21,"twist":null,"malts":[["Maris Otter",3],["Rye",0.25],["Flaked Oats",0.25]],"hops":[["Bramling Cross",7,"grams","15","Bitter"],["Coriander",4,"grams","15","Aroma"],["Peppercorn",2,"grams","15","Flavour"],["Amarillo",15,"grams","Whirlpool","Aroma"]],"yeast":"Wyeast 3711 - French Saison™","food":["Taleggio and Spinach Tart","Chicken Adobo","Crème Caramel"],"tips":"This will ferment out very dry due to the yeast."},{"n":241,"name":"Hello My Name Is Ingrid 2016","tagline":"Cloudberry Double IPA","first":"2016","desc":"We asked the public to tell us the one beer we should brew again, from our entire back catalogue. They chose well. Cloudberries team up with pan-global hops for an all out fruit riot against a caramel malt base.","abv":8.2,"ibu":70,"og":1076,"fg":1013,"ebc":30,"ph":5.2,"att":83.3,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":21,"twist":null,"malts":[["Extra Pale",4.9],["Caramalt",0.7]],"hops":[["Columbus",8,"grams","Start","Bitter"],["Centennial",8,"grams","Start","Bitter"],["Columbus",5,"grams","Middle","Flavour"],["Centennial",5,"grams","Middle","Flavour"],["Enigma",5,"grams","Middle","Flavour"],["Bramling Cross",6,"grams","Middle","Flavour"],["Columbus",6,"grams","End","Flavour"],["Centennial",6,"grams","End","Flavour"],["Enigma",5,"grams","End","Flavour"],["Bramling Cross",6,"grams","End","Flavour"],["Citra",30,"grams","Dry Hop","Aroma"],["Enigma",60,"grams","Dry Hop","Aroma"],["Bramling Cross",30,"grams","Dry Hop","Aroma"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Tempura Prawns","Soy-Glazed Chicken Thighs","Raspberry Soufflé"],"tips":"Add the cloudberries to your beer when racking the beer after primary fermentation. Grind them into a paste to allow maximum flavour extraction."},{"n":242,"name":"Crew Brew","tagline":"Democratic Amber Ale","first":"2016","desc":"Our crew designed it, and we bottled it just for ourselves! We chose an 8% red ale, mash hopped and first wort hopped with New Zealand origin hops.","abv":8,"ibu":100,"og":1072,"fg":1011,"ebc":28,"ph":5.2,"att":84.62,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":21,"twist":null,"malts":[["Maris Otter",4],["Munich",0.5],["Crystal",0.5],["Carahell",0.5],["Wheat",0.5]],"hops":[["Cascade",10,"grams","Mash","Bitter"],["Nelson Sauvin",10,"grams","Mash","Bitter"],["Cascade",30,"grams","Start","Bitter"],["Nelson Sauvin",15,"grams","Start","Bitter"],["Cascade",15,"grams","Middle","Flavour"],["Nelson Sauvin",15,"grams","Middle","Flavour"],["Cascade",100,"grams","End","Aroma"],["Nelson Sauvin",100,"grams","End","Aroma"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Panko-coated Chicken Katsu","Classic Cheddar Ploughmans","Pecan Pie"],"tips":"Bring a few bottles to your local BrewDog bar when it's done and ask the staff if you got it right, they're the only ones who can tell you for sure! They'll also probably know of other homebrewers and beer enthusiasts nearby that you can link in with to share your experiences and get awesome first hand advice from."},{"n":243,"name":"Gin Blitz","tagline":"Botanical Berliner Weisse","first":"2016","desc":"Our Blitz series sees us brew up low abv, super tart Berliner Weisse, and generally infuse them with bags of sour fruit flavour – but this batch uses gin botanicals instead.","abv":3.2,"ibu":8,"og":1038,"fg":1008,"ebc":8,"ph":3.2,"att":75,"batchL":20,"boilL":25,"mash":[[60,30],[65,20],[72,15],[78,10]],"ferm":21,"twist":"Kettle Soured","malts":[["Maris Otter",1.5],["Wheat",1.5]],"hops":[["Bramling Cross",6,"grams","Start","Bitter"],["Juniper Berry",400,"grams","Start","Aroma"],["Coriander",20,"grams","Start","Aroma"],["Orange Peel",155,"grams","Start","Aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Game Terrine with Pickles","Fish Tacos","Peach Melba"],"tips":"Crack open/mash up the Juniper berries to get the most flavour and aroma from them."},{"n":244,"name":"AB:21","tagline":"Liquorice Blackcurrant Stout.","first":"2016","desc":"AB:21 is a liquorice and blackcurrant infused imperial stout. Rolling in at an imposing 12% abv, this huge and decadent dark beer dials down the charred roastiness and focuses instead on the rich, full-bodied chocolate and dark fruit character of the style.","abv":12,"ibu":100,"og":1130,"fg":1015,"ebc":200,"ph":5.1,"att":82,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":"Liquorice and 200g Blackcurrant Concentrate FV.","malts":[["Extra Pale",7.2],["Brown",1],["Double Roasted Crystal",1],["Flaked Oats",1]],"hops":[["Galena",40,"grams","Start","Bitter"],["Bramling Cross",40,"grams","Middle","Flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Steak Pie and Winter Vegetables","Chocolate Torte","Blackcurrant Panna Cotta"],"tips":"As with all of our Abstrakts this one is great for ageing. Be extra vigilant at all times as a small fault now will lead to disaster a few years down the line."},{"n":245,"name":"Beatnik","tagline":"Imperial Red Ale","first":"2016","desc":"We gave our Equity Punks the keys to the brewery and let them brew the beer, as well as join Q&As and tour our HQ. The beer was voted on exclusively by Equity Punks.","abv":8,"ibu":60,"og":1075,"fg":1013,"ebc":60,"ph":5.2,"att":83.78,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Maris Otter",5],["Munich",0.53],["Dark Crystal",0.27]],"hops":[["Apollo",26.67,"grams","Start","Bitter"],["Centennial",13.33,"grams","Middle","Flavour"],["Centennial",13.33,"grams","End","Aroma"],["Simcoe",13.33,"grams","End","Aroma"],["Simcoe",1.33,"grams","Dry Hop","Aroma"],["Apollo",0.67,"grams","Dry Hop","Aroma"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Loaded Hamburger and Spicy Fries","Warm Banana Bread","Pineapple Sponge Cake"],"tips":"Lightly toast the coconut chips to allow better interaction with the hot wort."},{"n":246,"name":"Casino Rye Ale","tagline":"Life's a Gamble","first":"2016","desc":"We’ve split our bets with Casino Rye Ale and doubled up on the malt front, with barley and rye on the grain bill.","abv":5.1,"ibu":40,"og":1049,"fg":1009,"ebc":25,"ph":5.2,"att":81.6,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":21,"twist":null,"malts":[["Extra Pale",2.6],["Simpsons Rye",0.5],["Medium Crystal",0.15]],"hops":[["Equinox",10,"grams","Start","Bitter"],["Equinox",40,"grams","Middle","Flavour"],["Equinox",150,"grams","End","Aroma"],["Equinox",150,"grams","Dry Hop","Aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Crab Cakes","Spicy Bean Burrito","Dundee Fruit Cake"],"tips":"We don't recommend roulette as a way to design beer. Spin the bottle is a much more sensible option. Make this beer with the freshest ingredients you can. Try to arrange brewday as close to delivery day as possible and throw 10 brewbucks on black 17 for us."},{"n":247,"name":"Self Assembly Pope","tagline":"Coconut Vanilla Porter","first":"2016","desc":"A dark and decadent beer brewed with coconut, vanilla, cacao.","abv":7.4,"ibu":75,"og":1072,"fg":1016,"ebc":200,"ph":5.1,"att":82,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":"Toasted Coconut Chips – 40g FV & Vanilla Extract – FV","malts":[["Pale Ale",3.6],["Wheat",0.2],["Dextrin Malt",0.2],["Chocolate",0.35],["Double Roasted Crystal",0.3]],"hops":[["Galena",30,"grams","Start","Bitter"],["Dark Muscavado",400,"grams","Additions","Flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Beef Rendang","Coconut Macaroons","Profiteroles with Chantilly Cream"],"tips":"Don't be shy with the roasted coconut, it's a delicate flavour compared to the rest of the beer, so go nuts! If it grows wild near you, go grab some Gorse and chuck it in too for a local natural boost to the coconut flavours."},{"n":248,"name":"Twin Atlantic","tagline":"Mango & Pineapple Pale","first":"2016","desc":"Brewed in collaboration with our AGM-headlining band, Twin Atlantic, this US style pale features some of our favourite hops and is loaded with tropical fruit.","abv":5,"ibu":80,"og":1048,"fg":1011,"ebc":19,"ph":5.2,"att":77,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":"Mango and Pineapple added to FV after Primary fermentation","malts":[["Pale Ale",3],["Caramalt",0.2]],"hops":[["Cascade",40,"grams","End","Aroma"],["Equinox",40,"grams","End","Aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Jerk Chicken Kebabs with Mango Salsa","Avocado and Citrus Salad","Pineapple Upside Down Cake"],"tips":"If you can't find an awesome Scottish band to collaborate with just pump up the volume on your stereo and have fun moshing whilst you're mashing in. Use ripe but fresh fruit and be prepared to lose extra volume to it. It'll be worth it."},{"n":249,"name":"Hop Shot","tagline":"Quadruple India Pale Ale","first":"2016","desc":"Hop Shot is a high-velocity hop hit. Our latest experiment in ice-distillation is a west coast IPA, subjected to Antarctic temperatures and concentrated by removing the ice that forms. The result is a 22% ABV hop grenade in a 110ml bottle.","abv":7,"ibu":250,"og":1065,"fg":1010,"ebc":15,"ph":4.4,"att":85,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":21,"twist":null,"malts":[["Extra Pale",5.8]],"hops":[["Centennial",25,"grams","Start","Bitter"],["Columbus Extract",30,"grams","Start","Bitter"],["Centennial",18.75,"grams","Middle","Flavour"],["Columbus",18.75,"grams","Middle","Flavour"],["Centennial",50,"grams","End","Flavour"],["Columbus",25,"grams","End","Flavour"],["Amarillo",100,"grams","Dry Hop","Aroma"],["Citra",100,"grams","Dry Hop","Aroma"],["Simcoe",100,"grams","Dry Hop","Aroma"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Phall Curry","Pork Burrito with a Habanero and Mango Chili Salsa","Ginger and Grapefruit Poundcake"],"tips":"This level of alcohol can be achieved using a domestic freezer. Use a container with a tap close to the bottom so you can run the un-frozen, concentrated beer from under the ice on top. You may have to do this three or four times. The colder you freeze it the boozier it gets. Be careful to not dilute it too much when draining off the concentrated liquid after freezing so you don’t dilute it too much."},{"n":250,"name":"Small Batch: Rye IPA","tagline":"Rye India Pale Ale.","first":"2016","desc":"A 7.2% rye IPA loaded with grapefruit notes, pithy citrus, and huge resinous bitterness, with rye character. The Centennial and Columbus flavours are amplified by the spicy, dry rye.","abv":7.2,"ibu":100,"og":1065,"fg":1010,"ebc":8,"ph":4.4,"att":84,"batchL":20,"boilL":25,"mash":[[60,30],[65,20],[72,15],[78,10]],"ferm":21,"twist":null,"malts":[["Maris Otter",4],["Rye",0.8]],"hops":[["Centennial",40,"grams","60","Bitter"],["Centennial",15,"grams","15","Bitter"],["Columbus",15,"grams","15","Flavour"],["Centennial",50,"grams","Whirlpool","Aroma"],["Columbus",25,"grams","Whirlpool","Aroma"],["Columbus",10,"grams","Dry Hop","Aroma"],["Citra",10,"grams","Dry Hop","Aroma"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Salmon Fishcakes with Rocket Salad","Baked Goat's Cheese","Classic Victoria Sponge"],"tips":"Be prepared for a long sparge as the rye content is really high."},{"n":251,"name":"Small Batch: Sorachi Ace Session","tagline":"Sorachi Ace Belgian Pale.","first":"2016","desc":"This brew is a pale ale fermented with Belgian yeast and spiced with coriander seed.","abv":4,"ibu":25,"og":1035,"fg":1005,"ebc":15,"ph":5.1,"att":79,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":"Crushed Coridaner Seeds – FV","malts":[["Pale Ale",2],["Crisp Rye",0.22],["Munich",0.11],["Wheat",0.17],["Acidulated Malt",0.06]],"hops":[["Sorachi Ace",22,"grams","Start","Bitter"],["Sorachi Ace",22,"grams","End","Flavour"]],"yeast":"Wyeast 1388 - Belgian Strong Ale™","food":["Californian Sushi Roll","Parmesan and Rocket Pizza","Coconut Cake"],"tips":"If you dry hop with extra Sorachi Ace you'll end up with an awesome extra hit of lemony zing but be warned, it'll go through a lot of interesting variations on the way, including coconut and even bubblegum! Give it time though and it'll land back at that lovely lemon zest that will compliment the coriander seeds perfectly."},{"n":252,"name":"Small Batch: Dortmunder","tagline":"Pale Lager.","first":"2017","desc":"A pale lager, with toasty biscuit malt balanced against a robust spicy bitterness.","abv":4.9,"ibu":32,"og":1049,"fg":1009,"ebc":15,"ph":5.2,"att":81.5,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":14,"twist":null,"malts":[["Pilsner",5.16],["Pale Ale",1.72]],"hops":[["Magnum",5,"grams","Start","Bitter"],["Sterling",10,"grams","Start","Bitter"],["Sterling",10,"grams","End","Flavour"]],"yeast":"Wyeast 2124 - Bohemian Lager™","food":["Cajun Chicken Burger","Baked Brie","Tomato and Herb Bruschetta"],"tips":"To really nail this style you need to get the water right. Do a bit of research on water profiles and ask a local brewery if they can help you out with some water treatments."},{"n":253,"name":"Small Batch: 90 Shilling","tagline":"Honeyed Spicy Malt.","first":"2017","desc":"A malt-forward Scotch ale with a complex but mellow mix of toast crust, caramel, hints of cocoa, and a light hop spiciness.","abv":5.3,"ibu":25,"og":1056,"fg":1010,"ebc":40,"ph":4.2,"att":73,"batchL":20,"boilL":25,"mash":[[54,75]],"ferm":19,"twist":null,"malts":[["Propino Pale Malt",5.6],["Premium English Caramalt",0.6],["Munich",0.6],["Amber",0.2],["Dark Crystal",0.2],["Brown",0.2]],"hops":[["Bramling Cross",10,"grams","Start","Bitter"],["First Gold",10,"grams","Start","Bitter"],["First Gold",5,"grams","Middle","Flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Game Terrine","Barbecue-griddled Poussin","Clootie Dumpling"],"tips":"Pre-mix your malts to keep the conversion of starches to sugars even across the mash and give you a more uniform grain bed for lautering and sparging. This is a lot less labour intensive than manually stirring your speciality malts into your mash tun."},{"n":254,"name":"Small Batch: Kellerbier","tagline":"Crisp Unfiltered Goodness.","first":"2017","desc":"A pale lager, with toasty biscuit malt balances against a robust spicy bitterness.","abv":4.5,"ibu":25,"og":1043,"fg":1011,"ebc":17,"ph":5.3,"att":79,"batchL":20,"boilL":25,"mash":[[56,75]],"ferm":10,"twist":null,"malts":[["Propino Pale Malt",1.2],["Pilsner",1.35],["Munich",0.5],["Amber",0.1]],"hops":[["Perle",5,"grams","Start","Bitter"],["Hallertauer Mittelfrüh",7,"grams","Start","Bitter"],["Mandarina Bavaria",20,"grams","End","Flavour"]],"yeast":"Wyeast 2124 - Bohemian Lager™","food":["Bratwurst and Mustard","Caraway Roast Pork","Gingerbread Cake"],"tips":"Kellerbier translates to cellar beer, if you don’t have a cellar just make sure to keep the fermentation temperature as close as possible to what you'd expect in a bavarian basement."},{"n":255,"name":"Small Batch: Tripel","tagline":"Spiced Belgium Ale.","first":"2017","desc":"Intense spicy and citrusy notes backed up with a bitter edge and a warming but dry malt biscuit backbone. This beer comes into its own after cellaring cool for a few weeks.","abv":13,"ibu":50,"og":1110,"fg":1008,"ebc":23,"ph":5.1,"att":93,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":21,"twist":null,"malts":[["Pale Ale",7.4],["Wheat",1]],"hops":[["Mandarina Bavaria",20,"grams","Start","Bitter"],["Mandarina Bavaria",40,"grams","Middle","Aroma"],["Ginger Powder",10,"grams","End","Bitter"],["Pink Peppercorns",20,"grams","End","Bitter"],["Bitter Orange Peel",20,"grams","End","Flavour"],["Oat Husks",40,"grams","End","Flavour"]],"yeast":"Wyeast 1388 - Belgian Strong Ale™","food":["Coriander & Chilli Crab Cakes","Basil Pasta","Caramelised Orange Cheesecake"],"tips":"Brew twice as much Belgian Tripel as you were planning on ageing - it's awesome on its own too!"},{"n":256,"name":"Small Batch: Vermont IPA","tagline":"Juicy, Tropical, Citrusy.","first":"2017","desc":"A vermont style IPA, with low background bitterness, loaded with intense juicy fruit character.","abv":6.9,"ibu":35,"og":1066,"fg":1012,"ebc":15,"ph":4.2,"att":79,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Pale Ale",3.3],["Maris Otter",0.8],["Wheat",0.5],["Flaked Oats",0.2]],"hops":[["Chinook",1,"grams","Middle","Aroma"],["Chinook",20,"grams","End","Flavour"],["Amarillo",30,"grams","End","Flavour"],["Simcoe",30,"grams","End","Flavour"],["Citra",50,"grams","Dry Hop","Aroma"],["Amarillo",50,"grams","Dry Hop","Aroma"],["Mosaic",50,"grams","Dry Hop","Aroma"],["Simcoe",50,"grams","Dry Hop","Aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Chicken Korma","Lobster Tail Salad","Chickpea and Apricot Tagine"],"tips":"Add the dry hops in separate muslin bags to increase surface area contact and reduce the amount of hop matter in the beer after dry hopping without reducing the characteristic hazy look of the beer."},{"n":257,"name":"Semi Skimmed Occultist","tagline":"Oatmeal Milk Stout.","first":"2017","desc":"This one-off brew is packed with all the decadent flavours and textures associated with Imperial Stouts. This can features exclusive artwork by The Red Dress.","abv":8,"ibu":70,"og":1080,"fg":1014,"ebc":160,"ph":4.1,"att":73,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":18,"twist":null,"malts":[["Pale Ale",7.8],["Flaked Oats",1],["Brown",0.8],["Extra Dark Crystal",0.4],["Wheat",0.4],["Carafa Special Malt Type 1",0.4],["Chocolate",0.2]],"hops":[["Magnum",10,"grams","Start","Bitter"],["Lactose",600,"grams","Middle","Aroma"],["Coffee",20,"grams","Dry Hop","Flavour"],["Cacoa Nibs",20,"grams","Dry Hop","Flavour"],["Vanilla",4,"grams","Dry Hop","Flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Pan-Seared Venison with Blackberries","Fig Tart","Dark Chocolate and Coffee Torte"],"tips":"Surface area contact is key in dry additions. Make sure your coffee and cacao nibs are weighed down with something and spread them out between multiple muslin bags if you can. This is not an exact science so taste as you go and swap out for fresh coffee and/or cacao if you haven't gotten the flavour you want after five days or so. You will not have this problem with the vanilla."},{"n":258,"name":"Paradox Rye","tagline":"Rye Whisky Barrel-Aged Imperial Stout.","first":"2005","desc":"In 2006 James and Martin hijacked a beer dinner run by Michael Jackson, the acclaimed beer and whisky writer, and convinced him to taste one of their home brews. This was a defining moment in BrewDog prehistory, and that beer was the first incarnation of the ubiquitous Paradox. Aged in a variety of casks over the years, Paradox is dark, decadent and encapsulating. Can be enjoyed fresh; phenomenal when aged.","abv":13,"ibu":100,"og":1112,"fg":1015,"ebc":300,"ph":4.4,"att":84,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":21,"twist":"Age this beer in Rye Whisky Casks.","malts":[["Extra Pale",6.5],["Caramalt",0.875],["Munich",0.5],["Flaked Oats",2],["Dark Crystal",0.875],["Carafa Special Malt Type 1",0.25],["Carafa Special Malt Type 3",0.5]],"hops":[["Columbus",60,"grams","Start","Bitter"],["Columbus",20,"grams","Middle","Flavour"],["Saaz",20,"grams","End","Flavour"],["First Gold",20,"grams","End","Flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Char-grilled Lamb Cutlets","BBQ Brisket","Chocolate and Strawberry Mousse"],"tips":"The beauty of this beer is in how brilliantly it lends itself to infusing or ageing. Experiment with different additions when the beer is ageing, taste it regularly to gauge its progress, and make sure you package it at its peak."},{"n":259,"name":"Tropic Thunder","tagline":"Island-Hopping Stout.","first":"2016","desc":"Tropic Thunder is the winner of the first ever #HomeBrewDog competition; the brainchild of Tom Doyle, this beer was the highest rated of the 307 beers that were tasted. A full-bodied and complex stout loaded with chocolate, mocha and roasty flavours, finishing with a vibrant burst of orange.","abv":7,"ibu":25,"og":1074,"fg":1020,"ebc":170,"ph":4.2,"att":73,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":19,"twist":null,"malts":[["Propino Pale Malt",3.8],["Medium Crystal",0.3],["Extra Dark Crystal",0.05],["Premium English Caramalt",0.3],["Brown",0.5],["Chocolate",0.2]],"hops":[["Magnum",2,"grams","Start","Bitter"],["Hallertauer Mittelfrüh",20,"grams","Start","Bitter"],["First Gold",10,"grams","Start","Bitter"],["Hallertauer Mittelfrüh",7,"grams","End","Flavour"],["Sweet Orange Peel",20,"grams","Whirlpool","Flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Steak and Kidney Pie","Pork Carnitas","Chocolate Orange Brownies"],"tips":"If you are feeling adventurous, and haven’t guzzled your whole batch upon first tasting it, try mulling this like you would a wine or cider. Cinnamon and clove will really lend themselves to the flavour of Tropic Thunder and mulled beer is definitely cooler than the usual offerings at a winter gathering."},{"n":260,"name":"New England IPA","tagline":"Vermont IPA","first":"2017","desc":"BrewDog vs Cloudwater is a 6.8% Vermont-style India Pale Ale, hopped with Mosaic in the whirlpool only. Without any big- hitting additions of hops in the boil, we carried the flavour by heavily dry-hopping the brew with Citra and Mosaic. We also used oats in the recipe to deliver the trademark smooth mouthfeel – and made it truly authentic by propagating a one-off culture of Vermont yeast, specifically for the brew.","abv":6.8,"ibu":45,"og":1065,"fg":1012,"ebc":17,"ph":4.2,"att":79,"batchL":20,"boilL":25,"mash":[[68,75]],"ferm":18,"twist":null,"malts":[["Propino Pale Malt",3.4],["Torrified Wheat",0.39],["Flaked Oats",0.56]],"hops":[["Mosaic",33,"grams","Whirlpool","Aroma"],["Citra",83,"grams","Dry Hop","Aroma"],["Mosaic",83,"grams","Dry Hop","Aroma"]],"yeast":"WLP4000 - Vermont Ale","food":["Goat's Cheese Bruschetta","Pan-Fried Lemon Sole","Baked Peaches with Citrus Fruit Reduction"],"tips":"Skip the arrageenan (Irish Moss), all haze is good haze in this beer."},{"n":261,"name":"Small Batch: Nitro Breakfast Stout","tagline":"Boozy Chocolate Milkshake.","first":"2017","desc":"An utterly indulgent, smooth as hell Stout. With opulent flavours of chocolate milkshake, roasty espresso coffee, and mellow vanilla, this beer has a full-bodied and creamy mouthfeel.","abv":8,"ibu":80,"og":1092,"fg":1027,"ebc":88,"ph":5.2,"att":70,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":21,"twist":null,"malts":[["Extra Pale",4.38],["Flaked Oats",0.62],["Brown",0.62],["Dark Crystal",0.25],["Wheat",0.25],["Carafa Special Malt Type 1",0.19]],"hops":[["Magnum",37.5,"grams","Start","Bitter"],["Lactose",262.5,"grams","Middle","Aroma"],["Vanilla Extract",25,"grams","End","Flavour"],["Cacao Nibs",25,"grams","End","Flavour"],["Coffee",25,"grams","End","Flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Habanero Pulled Pork","Choc Chip Cookies,","Black Pudding Croquettes"],"tips":"* Not a suitable replacement for an actual breakfast. Nitroing at home is, well, not impossible but unlikely. Luckily this beer tastes great when lightly carbonated too! Be prepared for a slow runoff and don’t skimp on the cacao!"},{"n":262,"name":"Small Batch: Vermont IPA V2.0","tagline":"Juicy, Citrusy, Tropical.","first":"2017","desc":"A second trial of our previous Small Batch Vermont IPA using a different yeast strain. A vermont style IPA, with low background bitterness, loaded with intense juicy fruit characters.","abv":6.9,"ibu":35,"og":1066,"fg":1012,"ebc":15,"ph":4.2,"att":79,"batchL":20,"boilL":25,"mash":[[68,75]],"ferm":19,"twist":null,"malts":[["Propino Pale Malt",3.3],["Maris Otter",0.8],["Wheat",0.5],["Flaked Oats",0.2]],"hops":[["Chinook",1,"grams","Middle","Aroma"],["Chinook",20,"grams","End","Flavour"],["Amarillo",30,"grams","End","Flavour"],["Simcoe",30,"grams","End","Flavour"],["Citra",50,"grams","Dry Hop","Aroma"],["Amarillo",50,"grams","Dry Hop","Aroma"],["Mosaic",50,"grams","Dry Hop","Aroma"],["Simcoe",50,"grams","Dry Hop","Aroma"]],"yeast":"WLP4000 - Vermont Ale","food":["Chicken Korma","Lobster Salad","Chicken and Apricot Tagine"],"tips":"DON’T add flour. This “tip” has been floating around for the style and it’s bad advice. Any and all murk should accompany something that enhances the beer. This little juice-box is dry hopped at a rate of 10g per litre. Wonder what would happen if you doubled that..."},{"n":263,"name":"Small Batch: Mandarina Lager","tagline":"Pithy Pale Pilsner.","first":"2017","desc":"A bitter pils-style lager which is packed with aromas of citrus and a dry, refreshing biscuit malt backbone. Light floral notes add to the complexity.","abv":5.3,"ibu":40,"og":1049,"fg":1008,"ebc":7,"ph":4.3,"att":84,"batchL":20,"boilL":25,"mash":[[64,35]],"ferm":10,"twist":null,"malts":[["Pilsner",3.096],["Pale Ale",1.032]],"hops":[["Magnum",4,"grams","70","Bitter"],["Mandarina Bavaria",20,"grams","15","Flavour"],["Mandarina Bavaria",20,"grams","0","Aroma"]],"yeast":"Wyeast 2126 - Bohemian Lager™","food":["Green Thai Curry","Fish Tacos","Goat's Cheese Salad With Walnuts, Radish And Blood Orange"],"tips":"After boiling your wort, chill the wort down quickly to avoid the compound DMS forming. DMS gives beer a tinned sweetcorn like aroma."},{"n":264,"name":"Small Batch: East Coast Crush","tagline":"Session Vermont IPA.","first":"2017","desc":"East Coast Crush is a Vermont style pale ale, packaged and served using our custom LIVE beer dispense. A session Vermont IPA, with low background bitterness, loaded with intense juicy mango, pineapple, peach and pine.","abv":4.8,"ibu":25,"og":1047,"fg":1010,"ebc":15,"ph":4.2,"att":79,"batchL":20,"boilL":25,"mash":[[64,30]],"ferm":19,"twist":null,"malts":[["Pale Ale",3.24],["Uncrushed Wheat",0.6],["Flaked Oats",0.24]],"hops":[["Chinook",20,"grams","Start","Aroma"],["Mandarina Bavaria",20,"grams","Start","Aroma"],["Simcoe",30,"grams","Start","Aroma"],["Citra",50,"grams","Dry Hop","Aroma"],["Mandarina Bavaria",50,"grams","Dry Hop","Aroma"],["Mosaic",50,"grams","Dry Hop","Aroma"],["Simcoe",50,"grams","Dry Hop","Aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Chickpea and Apricot Tagine","Pan-fried Lemon Sole","Lobster Salad"],"tips":"Vermont Yeast, whilst desirable for this style of beer, is not absolutely necessary. The murk of a NEIPA can be achieved by malt selection and your process."},{"n":265,"name":"Pump Action Poet","tagline":"Stone Fruit IPA.","first":"2017","desc":"A one-off beer which combines the sweet and juicy flavour of stonefruit with tropical hop aromas. This can features exclusive artwork by Tracie Ching.","abv":7.5,"ibu":40,"og":1070,"fg":1013,"ebc":12,"ph":5.2,"att":81,"batchL":20,"boilL":25,"mash":[[66,40]],"ferm":19,"twist":null,"malts":[["Pale Ale",4.86],["Wheat",0.54],["Flaked Oats",0.54]],"hops":[["Amarillo",40,"grams","Start","Aroma"],["Simcoe",40,"grams","0","Aroma"],["Apricot Juice",1,"kilogram","Flame Out","Flavour"],["Peach Juice",1,"kilogram","Flame Out","Flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Citrus Salad","Spicy Chilli Prawns","Orange Zest Tart"],"tips":"Adding the fruit at the end of the boil effectively pasteurises it. If you plan to add fruit after primary fermentation, buy aseptic puree or have a plan to pasteurise it before adding it."},{"n":266,"name":"Small Batch: Lemon Meringue Pie","tagline":"Experimental Dessert Beer.","first":"2017","desc":"Brewed to a concept voted on at Craft Beer Rising, this one-off beer is an experimental brew which emulates the flavour of lemon meringue pie.","abv":6.5,"ibu":5,"og":1066,"fg":1015,"ebc":7,"ph":4,"att":77,"batchL":20,"boilL":25,"mash":[[65,90]],"ferm":19,"twist":null,"malts":[["Maris Otter",4.533],["Dextrin Malt",0.567],["Flaked Oats",0.567]],"hops":[["Amarillo",30,"grams","0","Aroma"],["Sorachi Ace",30,"grams","0","Aroma"],["Lemon Peel",4,"grams","Flame Out","Flavour"],["Coriander Seeds",2,"grams","Flame Out","Flavour"],["Lemon Concentrate",100,"grams","Flame Out","Flavour"]],"yeast":"Wyeast 1056 - American Ale™","food":["Lemon Tart"],"tips":"Dextrin Malt adds sugars to your wort that the yeast are unable to ferment. If you want a sweetness remaining in your beer, add a little of this but not too much!!!"},{"n":267,"name":"AB:22","tagline":"Speyside Barrel-Aged Coffee Chocolate Stout.","first":"2017","desc":"An imperial stout brewed with cacao and coffee, AB22 has spent two years in darkness, drawing complex and indulgent flavours from the Speyside whisky casks in which it resided.","abv":12.5,"ibu":70,"og":1115,"fg":1020,"ebc":100,"ph":4.1,"att":83,"batchL":20,"boilL":25,"mash":[[65,75]],"ferm":21,"twist":null,"malts":[["Pale Ale",8.16],["Golden Naked Oats",0.96],["Medium Crystal",0.48],["Brown",0.24],["Carafa Special Malt Type 3",0.12]],"hops":[["Columbus",40,"grams","First Wort Hops","Bittering"],["American Oak Chips Medium Toast Soaked In Speyside Whisky",4,"grams","Flame Out","Flavour"],["Black Pepper",4,"grams","Flame Out","Flavour"],["Cardamon",10,"grams","Flame Out","Flavour"],["Ginger",10,"grams","Flame Out","Flavour"],["Nutmeg",2,"grams","Flame Out","Flavour"],["Cinnamon",2,"grams","Flame Out","Flavour"],["Star Anis",1,"grams","Flame Out","Flavour"]],"yeast":"Wyeast 1272 - American Ale II™","food":["Roast Pheasant With Savoy Cabbage","Chilli Beer Tacos","Dark Chocolate Truffles"],"tips":"Soak American oak (medium toasted) chips in your favourite Speyside tipple overnight and add them after primary fermentation"},{"n":268,"name":"Hazy Jane","tagline":"New England IPA.","first":"2017","desc":"A Vermont style IPA, with low background bitterness, loaded with juicy fruit character. Pine, stonefruit, mango, light resin and hints of lime peel - this juicy IPA is low in bitterness, full-bodied and smooth, enhancing the soft ripe fruit flavours.","abv":7.2,"ibu":30,"og":1065,"fg":1009,"ebc":15,"ph":4.2,"att":86,"batchL":20,"boilL":25,"mash":[[66,25]],"ferm":21,"twist":null,"malts":[["Pale Ale",3.96],["Maris Otter",0.96],["Wheat",0.6],["Flaked Oats",0.24]],"hops":[["Chinook",1,"grams","10","Flavour"],["Chinook",20,"grams","0","Aroma"],["Amarillo",20,"grams","0","Aroma"],["Simcoe",20,"grams","0","Aroma"],["Citra",50,"grams","Dry Hop","Aroma"],["Simcoe",50,"grams","Dry Hop","Aroma"],["Amarillo",50,"grams","Dry Hop","Aroma"],["Mosaic",50,"grams","Dry Hop","Aroma"]],"yeast":"Wyeast 1056 - American Ale™","food":["Goat's Cheese Bruschetta","Pan-Fried Lemon Sole","Baked Peaches With Citrus Fruit"],"tips":"This beer is supposed to be very cloudy. Don’t be shy to get a good bit of the hot break into the fermenter."},{"n":269,"name":"Small Batch: Imperial Pale Weizen","tagline":"Dry-Hopped Wheat Beer.","first":"2017","desc":"An amplified version of a style we first brewed with Weihenstephan. A full-on deluge of spice and citrus, the new world hops bring spiced orange, lemon peel and fresh grassy and floral notes while the weizen base adds pepper, clove and banana.","abv":7.5,"ibu":25,"og":1067,"fg":1010,"ebc":18,"ph":4.4,"att":85,"batchL":20,"boilL":25,"mash":[[65,90]],"ferm":21,"twist":null,"malts":[["Maris Otter",3.74],["White Wheat",2.267],["Extra Dark Crystal",0.091]],"hops":[["Magnum",10,"grams","60","Bitter"],["Ariana",12,"grams","15","Flavour"],["Cascade",12,"grams","15","Flavour"],["Mandarina Bavaria",12,"grams","15","Flavour"],["Ariana",10,"grams","Dry Hop","Aroma"],["Mandarina Bavaria",10,"grams","Dry Hop","Flavour"]],"yeast":"WLP351 - Bavarian Weizen","food":["Soft pretzel with mustard","Hot Smoked Salmon Salad","Rum Fried Banana"],"tips":"A German style wheat beer that is mostly defined by its yeast character. Yeast strain has a massive influence on the final perception of the beer."},{"n":270,"name":"Blonde Export Stout","tagline":"Beatnik Brewing Collective 2017.","first":"2017","desc":"Our Equity Punk gypsy brewery - Beatnik Brewing Collective - voted for this recipe as their 2017 ann
